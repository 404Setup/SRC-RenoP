          schema:
            type: string
            enum: [ "0", "1" ]
            default: "0"
          description: Set to 1 to run GC before sampling
      responses:
        "200":
          description: RuntimeMemoryBreakdown protobuf
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/RuntimeMemoryBreakdown"
        "403":
          description: Not a manager, or debug mode inactive

