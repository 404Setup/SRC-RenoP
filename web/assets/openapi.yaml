  # ========== npm package management ==========
  /api/npm/repositories/{repo_name}/packages:
    get:
      tags: [npm]
      summary: List npm packages or read one package
      description: Lists the visible bounded catalog. Supplying `package` returns package, version, dist-tag, and authorized team details.
      operationId: listNPMPackages
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - name: package
          in: query
          schema:
            type: string
          description: Optional canonical package name. Scoped names may be URL encoded.
        - name: query
          in: query
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: Package page or selected package details.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/NPMPackagePage"
                  - $ref: "#/components/schemas/NPMPackageDetails"
        "400":
          description: Invalid package name or pagination.
        "403":
          description: Repository is not visible to the caller.
    post:
      tags: [npm]
      summary: Reserve an npm package before publication
      description: Creates an empty package and assigns the caller L4. Scoped names require a matching global team where the caller has T3 or T4. npm publish cannot create packages implicitly.
      operationId: createNPMPackage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 214
                  example: "@example/library"
                super_team_prefix:
                  type: string
                  maxLength: 64
                  description: Required for scoped names; must match the scope without the leading at sign.
                private:
                  type: boolean
                  default: false
                  description: Private packages must use a scope.
      responses:
        "201":
          description: Package reserved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NPMPackage"
        "400":
          description: Invalid package name, missing team, or scope/team mismatch.
        "403":
          description: Repository creation permission or T3/T4 membership is missing.
        "409":
          description: Package already exists.
    put:
      tags: [npm]
      summary: Change npm package metadata or state
      description: Changes exactly one of `description`, `private`, or `archived` per request.
      operationId: updateNPMPackage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - name: package
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  maxLength: 4000
                private:
                  type: boolean
                archived:
                  type: boolean
      responses:
        "200":
          description: Package updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NPMOperationResponse"
    delete:
      tags: [npm]
      summary: Delete an npm package
      description: L4-only package deletion tombstones all versions and removes their stored tarballs.
      operationId: deleteNPMPackage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - name: package
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Package deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NPMOperationResponse"

