  /api/debug/memory/heap:
    get:
      tags: [ debug ]
      summary: Download Go heap pprof profile (flame graph)
      description: >
        Manager-only. Requires server.debug_mode enabled at process start.
        Default runs GC before dump (?gc=0 to skip). Open with Speedscope or go tool pprof.
      operationId: getDebugMemoryHeap
      parameters:
        - name: gc
          in: query
          schema:
            type: string
            enum: [ "0", "1" ]
            default: "1"
          description: Set to 0 to skip GC before sampling
      responses:
        "200":
          description: Binary pprof profile (application/octet-stream)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Not a manager, or debug mode inactive

  /api/debug/memory/allocs:
    get:
      tags: [ debug ]
      summary: Download Go allocs pprof profile
      operationId: getDebugMemoryAllocs
      responses:
        "200":
          description: Binary pprof profile
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Not a manager, or debug mode inactive

