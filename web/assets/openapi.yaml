      responses:
        "200":
          description: HTML page or jar-internal resource.
          content:
            text/html:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  # ========== Cargo ==========
  /{repo_name}/config.json:
    get:
      tags: [cargo]
      summary: Cargo sparse registry configuration
      description: |
        Returns the Cargo sparse registry `config.json` for the named repository.
        Tells the Cargo client where to find index entries and download crate files.
      operationId: getCargoConfig
      security:
        - {}
        - basicAuth: []
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
      responses:
        "200":
          description: Cargo registry configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dl:
                    type: string
                  api:
                    type: string
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /{repo_name}/api/v1/crates/new:
    put:
      tags: [cargo]
      summary: Publish a new crate version
      description: |
        Publishes a crate version using the standard Cargo publish wire format
        (4-byte JSON length + JSON metadata + 4-byte crate length + crate file).
        Requires write permission on the repository. A first publication cannot claim a name already exposed by an
        enabled upstream mirror; an unavailable upstream name check fails closed.
      operationId: putCargoPublish
      security:
        - basicAuth: []
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Crate published.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargoErrorList"
        "403":
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargoErrorList"
        "409":
          description: Version already exists, or the package name is occupied locally or upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargoErrorList"
        "503":
          description: An enabled upstream mirror could not provide an authoritative package-name result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargoErrorList"

