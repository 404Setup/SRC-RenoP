  /api/auth/profile/fido/register/begin:
    post:
      tags: [ auth ]
      summary: Begin FIDO device registration
      description: |
        Start a FIDO/WebAuthn registration session for the current user.
        Returns a `session_id` and the WebAuthn registration `options` to pass to the browser credential API.
      operationId: postAuthProfileFidoRegisterBegin
      security:
        - sessionCookie: [ ]
        - sessionHeader: [ ]
      responses:
        "200":
          description: Registration session started; returns session_id and WebAuthn options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  options:
                    type: object
                    description: WebAuthn PublicKeyCredentialCreationOptions
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/auth/profile/fido/register/finish:
    post:
      tags: [ auth ]
      summary: Finish FIDO device registration
      description: |
        Complete FIDO registration by submitting the `session_id`, a human-readable `name` for the device,
        and the browser-generated `credential` JSON from the WebAuthn API.
      operationId: postAuthProfileFidoRegisterFinish
      security:
        - sessionCookie: [ ]
        - sessionHeader: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ session_id, name, credential ]
              properties:
                session_id:
                  type: string
                name:
                  type: string
                  description: Human-readable label for the device.
                credential:
                  type: object
                  description: Browser-generated PublicKeyCredential JSON.
      responses:
        "200":
          description: Device registered. Returns the new FidoDeviceDto.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/FidoDeviceDto"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/auth/fido/login/begin:
    post:
      tags: [ auth ]
      summary: Begin FIDO passwordless login
      description: |
        Start a FIDO passwordless login flow. An optional `username` may be provided to scope the
        challenge; omit it for usernameless (resident key) flows.
      operationId: postAuthFidoLoginBegin
      security: [ ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Optional account name for username-based flows.
      responses:
        "200":
          description: Challenge started; returns session_id and WebAuthn options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  options:
                    type: object
                    description: WebAuthn PublicKeyCredentialRequestOptions
        "400":
          $ref: "#/components/responses/PlainBadRequest"

  /api/auth/fido/login/finish:
    post:
      tags: [ auth ]
      summary: Finish FIDO passwordless login
      description: |
        Complete FIDO authentication. On success, issues the browser `renop_session` cookie
        and returns a `SessionDetails` protobuf (same shape as POST /api/auth/login).
      operationId: postAuthFidoLoginFinish
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ session_id, credential ]
              properties:
                session_id:
                  type: string
                credential:
                  type: object
                  description: Browser-generated PublicKeyCredential JSON.
      responses:
        "200":
          description: |
            Authenticated. Sets `renop_session` cookie and returns SessionDetails protobuf.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: renop_session=…; HttpOnly; SameSite=Lax; Max-Age≈7d
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/SessionDetails"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/auth/profile/sessions:
    get:
      tags: [ auth ]
      summary: List own browser sessions
      description: |
        Returns browser login sessions for the authenticated user only.
        Basic and Bearer authentication do not create sessions and are not listed.
        Session secrets (cookie values) are never included; use `public_id` to revoke.
      operationId: getAuthProfileSessions
