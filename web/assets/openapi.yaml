openapi: 3.0.3
info:
  title: RenoP HTTP API
  version: "2.0"
  contact:
    url: https://github.com/404Setup/RenoP
  description: |
    Management and registry APIs for RenoP, a self-hosted artifact repository server
    supporting Maven, unstructured file storage, npm, Cargo (Rust sparse index), and Docker/OCI registries.

    Default listen address: `0.0.0.0:3000`.

    **Route layout:**
    - Management API: `/api/...`
    - Maven artifact storage: `/{repo}/{path}` (Maven 2 layout)
    - Unstructured file storage: `/{repo}/{path}`
    - Docker/OCI Distribution API: `/v2/...`
    - Cargo sparse registry: `/{repo}/config.json` and `/{repo}/api/v1/...`
    - npm registry: `/{repo}/{package}` and `/{repo}/-/...`
    - Javadoc preview: `/javadoc/{repo}/{path}`
    - Cargo-doc preview: `/cargodoc/{repo}/{path}`

    **Wire format:**
    Most management endpoints use `application/x-protobuf`. Schemas here describe the
    logical fields (snake_case) for documentation and client stub generation.
    See `proto/api/v1/api.proto` for canonical protobuf definitions.
    Docker/OCI, npm, and Cargo endpoints use JSON.

    **Error bodies:**
    Management errors are plain text (`Unauthorized`, `Forbidden`, `Not found`).
    Docker browser-management errors additionally expose a stable `X-Renop-Error-Code` header for localization.
    Docker Distribution API errors follow `{"errors":[{"code":"...","message":"...","detail":"..."}]}`.
    Cargo errors follow `{"errors":[{"detail":"..."}]}`.
    npm protocol errors follow `{"error":"...","reason":"..."}`; npm browser-management errors expose
    a stable `X-Renop-Error-Code` header. Global-team management uses the same stable error header.
    Always prefer the HTTP status code for programmatic handling.

  license:
    name: MPL-2.0
    url: https://mozilla.org/MPL/2.0/

x-tagGroups:
  - name: Authentication & Sessions
    tags: [auth, tokens]
  - name: Maven Repository
    tags: [maven, storage, javadoc]
  - name: Cargo Registry
    tags: [cargo]
  - name: npm Registry
    tags: [npm]
  - name: Docker / OCI Registry
    tags: [docker]
  - name: Global Collaboration
    tags: [super-teams]
  - name: Administration
    tags: [settings, messages, audit]
  - name: Operations
    tags: [status, statistics, updater, debug]

servers:
  - url: http://localhost:3000
    description: Local default

tags:
  - name: auth
    description: Login, cookie-only browser sessions, profile settings, API tokens, and FIDO2/WebAuthn device management.
  - name: tokens
    description: Account CRUD, session management, and publishing-token issuance (all require the `manager` permission).
  - name: maven
    description: Verified publishing domains, domain teams, artifact catalog, version management, and Maven helpers.
  - name: status
    description: Health probe, frontend asset hash, real-time instance metrics, and historical metric snapshots.
  - name: settings
    description: Configuration domain read/write, Maven repository configuration, and artifact index rebuild.
  - name: statistics
    description: API-token-only hierarchical download aggregates and administrator repository controls.
  - name: updater
    description: Online and offline binary update management, and process restart.
  - name: storage
    description: Maven-layout and unstructured-file access (GET, HEAD, PUT, POST, DELETE), including mirror resolution.
  - name: javadoc
    description: In-browser Javadoc jar preview extracted from Maven artifact jars.
  - name: debug
    description: pprof heap, allocation, and goroutine dumps, plus runtime memory breakdown. Requires `manager` permission and `server.debug_mode` enabled at process start.
  - name: messages
    description: User in-app message center — inbox listing, read/delete, and admin broadcast notifications.
  - name: audit
    description: Immutable activity audit log — self-view for all users, manager view and clear for any account.
  - name: cargo
    description: Sparse Cargo (Rust) registry endpoints mounted per-repository at `/{repo}/api/v1/` and `/{repo}/config.json`.
  - name: npm
    description: npm-compatible package metadata, immutable version publication, dist-tags, package teams, and upstream mirrors mounted under each npm repository.
  - name: docker
    description: OCI Distribution Specification v1.1.0 and Docker Registry v2, mounted at `/v2/`; browser-management failures use `X-Renop-Error-Code` for localized presentation.
  - name: super-teams
    description: Engine-independent global teams, immutable namespace prefixes, T1-T4 membership, invitations, and account limits.
  - name: reviews
    description: Session-only, independently paginated review tasks with single-decision ownership transfers.

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: renop_session
      description: HttpOnly session cookie issued by `POST /api/auth/login`. Idle timeout is approximately 7 days.
    basicAuth:
      type: http
      scheme: basic
      description: |
        `username:password` or `username:API-token` encoded as HTTP Basic credentials.
        Basic credentials are accepted only by standard package protocols, Docker token exchange, and chunked upload.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A prefixed API-token secret. API endpoints intersect the token's scopes with the owning account's current
        permissions. Query-string credentials and `Authorization: Session` are rejected.

  parameters:
    RepoName:
      name: repo_name
      in: path
      required: true
      schema:
        type: string
      description: Repository name (e.g. `releases`, `snapshots`, `private`).
    MavenPath:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: |
        Maven layout path relative to the repository root.
        The server treats this as a Fiber catch-all parameter (`*`).
    TokenName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Account name. Case-insensitive; stored and compared in lowercase.
    SessionPublicId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
      description: Session `public_id` as returned by the session list endpoints. Not the raw cookie secret.
    APITokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Non-secret API-token identifier returned by the token metadata endpoints.
    DomainName:
      name: name
      in: path
      required: true
      schema:
        type: string
        enum: [frontend, server, proxy, storage, updater, index]
      description: Configuration domain name.
    VersionFilter:
      name: filter
      in: query
      required: false
      schema:
        type: string
      description: Version substring filter applied server-side before returning results.
    VersionSorted:
      name: sorted
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: When true, versions are returned in descending semantic-version order.
    Channel:
      name: channel
      in: query
      required: false
      schema:
        type: string
        enum: [release, nightly]
        default: release
      description: Update channel to check or install from.
    StatisticsGroupBy:
      name: group_by
      in: query
      schema:
        type: string
        enum: [user, repository, namespace, package, version]
        default: repository
    StatisticsRepository:
      name: repository
      in: query
      schema:
        type: string
    StatisticsFormat:
      name: format
      in: query
      schema:
        type: string
        enum: [maven, files, cargo, docker, npm]
    StatisticsNamespace:
      name: namespace
      in: query
      schema:
        type: string
    StatisticsPackage:
      name: package
      in: query
      schema:
        type: string
    StatisticsVersion:
      name: version
      in: query
      schema:
        type: string
    StatisticsLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    StatisticsOffset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0

  responses:
    PlainUnauthorized:
      description: Not authenticated or credentials are invalid.
      content:
        text/plain:
          schema:
            type: string
            example: Unauthorized
    PlainForbidden:
      description: Authenticated but not permitted, or the account is expired.
      content:
        text/plain:
          schema:
            type: string
            example: Forbidden
    PlainNotFound:
      description: Resource not found. Some endpoints also return this for permission denials to avoid information disclosure.
      content:
        text/plain:
          schema:
            type: string
            example: Not found
    PlainBadRequest:
      description: Request parameters or body are invalid.
      content:
        text/plain:
          schema:
            type: string
            example: Bad Request
    PlainConflict:
      description: Conflict — resource already exists, an installation is already running, or a concurrent operation prevents this request.
      content:
        text/plain:
          schema:
            type: string
    JsonError:
      description: Structured JSON error object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    UpdaterJsonError:
      description: Localizable updater failure with a stable machine-readable code.
      headers:
        X-Renop-Error-Code:
          schema:
            type: string
            enum: [forbidden, insufficient_space, missing_file, install_busy, invalid_package, incompatible_binary, package_too_large, package_processing_failed, check_failed, notification_failed, restart_failed]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.

    StatusOk:
      type: object
      description: |
        Generic success acknowledgement. Returned as `application/x-protobuf` from mutating auth
        and session endpoints; returned as JSON `{"status":"success"}` from some other endpoints.
      properties:
        status:
          type: string
          example: success

    LoginRequest:
      type: object
      description: Credentials for password-based login (wire format `application/x-protobuf`).
      required: [name, secret]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Account username.
        secret:
          type: string
          minLength: 1
          maxLength: 72
          description: Account password.

    AccessTokenIdentifier:
      type: object
      description: Opaque identifier for an access token record.
      properties:
        type:
          type: string
          example: PERSISTENT
        value:
          type: integer
          format: int32

    AccessTokenDto:
      type: object
      description: Account or access-token descriptor returned by list and CRUD endpoints.
      properties:
        identifier:
          $ref: "#/components/schemas/AccessTokenIdentifier"
        name:
          type: string
          description: Account username (lowercased).
        created_at:
          type: string
          format: date-time
        description:
          type: string
        expires_at:
          type: integer
          format: int64
          nullable: true
          description: Expiry as Unix milliseconds; null means the account never expires.
        tokens:
          type: array
          items:
            type: string
          description: Redacted compatibility field. Its length is the account's API-token count; values are empty.
        permissions:
          type: array
          items:
            type: string
          description: Repository view, moderation, deployment, and system roles. `canmoderate` never grants settings access.
          example: ["manager", "canview:*", "canmoderate:releases", "canupdate:*"]

    APITokenScope:
      type: string
      enum:
        - repository:read
        - repository:publish
        - repository:delete
        - package:create
        - package:metadata
        - package:lifecycle
        - team:manage
        - domain:read
        - domain:create
        - domain:verify
        - domain:delete
        - package:manage
        - domain:manage
        - messages:read
        - account:read
        - account:write
        - statistics:read
        - admin:users
        - admin:repositories
        - admin:settings
        - admin:audit
        - admin:notifications
        - admin:updates
        - admin:statistics

    APIToken:
      type: object
      description: |
        Non-secret metadata for one durable fine-grained credential. `package:manage` and `domain:manage` may appear
        only on credentials created before capability splitting and cannot be assigned to new tokens.
      required: [id, name, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          maxItems: 24
          uniqueItems: true
          items:
            $ref: "#/components/schemas/APITokenScope"
        targets:
          $ref: "#/components/schemas/APITokenTargets"
        created_at:
          type: integer
          format: int64
          description: Creation time as Unix milliseconds.
        expires_at:
          type: integer
          format: int64
          nullable: true
          description: Expiration time as Unix milliseconds; omitted or null means no expiration.

    APITokenListResponse:
      type: object
      required: [tokens, limit]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/APIToken"
        limit:
          type: integer
          example: 50

    APITokenScopesResponse:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          description: Scopes currently assignable by this account. Administrator scopes are omitted for non-administrators.
          items:
            $ref: "#/components/schemas/APITokenScope"
        target_kinds:
          type: object
          description: Target kind accepted by each target-restrictable scope.
          additionalProperties:
            type: string
            enum: [repository, package, team, domain]
        target_limit:
          type: integer
          example: 128

    APITokenTargets:
      type: object
      description: |
        Optional exact-target restrictions keyed by a selected scope. Omitted scopes remain valid for every target
        authorized to the owning account. Repository values are repository names; package values use
        `repository/package`; team values use `package/repository/package` or `domain/domain-name`; domain values are
        canonical domain names. At most 128 target values are accepted across the object.
      additionalProperties:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          maxLength: 512

    CreateAPITokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          maxItems: 24
          uniqueItems: true
          items:
            $ref: "#/components/schemas/APITokenScope"
        targets:
          $ref: "#/components/schemas/APITokenTargets"
        expires_at:
          type: integer
          format: int64
          nullable: true
          description: Unix milliseconds, from five minutes through five years after creation; null means no expiration.

    CreateAPITokenResponse:
      type: object
      description: The secret is returned only by the successful creation response and is never recoverable later.
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/APIToken"
        secret:
          type: string
          minLength: 51
          maxLength: 51
          pattern: '^rnp_pat_[A-Za-z0-9_-]{43}$'

    AccessTokenPermission:
      type: object
      properties:
        identifier:
          type: string
        shortcut:
          type: string

    RoutePermission:
      type: object
      properties:
        identifier:
          type: string
          example: route:read
        shortcut:
          type: string
          example: r

    Route:
      type: object
      properties:
        path:
          type: string
        permission:
          $ref: "#/components/schemas/RoutePermission"

    SessionDetails:
      type: object
      description: Full session context returned after login or from `GET /api/auth/me` (protobuf `SessionDetails`).
      properties:
        access_token:
          $ref: "#/components/schemas/AccessTokenDto"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/AccessTokenPermission"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        session_token:
          type: string
          description: Retained for protobuf compatibility and always empty; browser session secrets are cookie-only.

    UserProfile:
      type: object
      description: Public account identity. The username is intentionally exposed only on the profile resource.
      required: [user_id, username, nickname, created_at, own_profile, username_changes_remaining, maven_domain_count, cargo_package_count, docker_image_count, npm_package_count]
      properties:
        user_id:
          type: string
          format: uuid
          description: Opaque immutable identifier carried only by stable data mutations; clients must not render it.
        username:
          type: string
          description: Case-insensitive login name.
        nickname:
          type: string
          maxLength: 36
          description: Public display name. An empty value means no nickname has been configured.
        created_at:
          type: string
          format: date-time
        own_profile:
          type: boolean
          description: Whether the current authenticated session owns this profile.
        username_changes_remaining:
          type: integer
          minimum: 0
          maximum: 2
          description: Included for a consistent response shape; meaningful only when `own_profile` is true.
        username_change_window_resets_at:
          type: integer
          format: int64
          description: Unix milliseconds when the active 24-hour rename window resets.
        maven_domain_count:
          type: integer
          minimum: 0
        cargo_package_count:
          type: integer
          minimum: 0
        docker_image_count:
          type: integer
          minimum: 0
        npm_package_count:
          type: integer
          minimum: 0

    UserPackageMembership:
      type: object
      description: One package team resolved through the account's immutable identifier.
      required: [format, repository, name, permission_level]
      properties:
        format:
          type: string
          enum: [maven, cargo, docker, npm]
        repository:
          type: string
        name:
          type: string
          description: Maven domain, Cargo/npm package name, or Docker image name.
        description:
          type: string
        permission_level:
          type: integer
          minimum: 0
          maximum: 4
        archived:
          type: boolean
          description: Cargo archive state; omitted for Docker images.

    UserProfileUpdateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 18
          pattern: '^[A-Za-z0-9_]+$'
        nickname:
          type: string
          maxLength: 36

    AccessTokenList:
      type: object
      description: List of all accounts (protobuf `AccessTokenList`).
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/AccessTokenDto"

    UpdatePasswordRequest:
      type: object
      description: Password change request (wire format `application/x-protobuf`).
      required: [new_password]
      properties:
        new_password:
          type: string
          minLength: 6
          maxLength: 72

    GenerateTokenResponse:
      type: object
      description: Newly generated publishing API token (wire format `application/x-protobuf`).
      properties:
        token:
          type: string
          minLength: 51
          maxLength: 51
          pattern: '^rnp_pat_[A-Za-z0-9_-]{43}$'

    UploadTokenResponse:
      type: object
      description: Legacy alias for `GenerateTokenResponse`.
      properties:
        token:
          type: string
          minLength: 51
          maxLength: 51
          pattern: '^rnp_pat_[A-Za-z0-9_-]{43}$'

    FidoDeviceDto:
      type: object
      description: Registered FIDO2/WebAuthn device descriptor (protobuf `FidoDeviceDto`).
      properties:
        id:
          type: string
          description: Opaque device credential ID (base64url-encoded).
        username:
          type: string
        name:
          type: string
          description: Human-readable label assigned during registration.
        created_at:
          type: integer
          format: int64
          description: Registration timestamp as Unix milliseconds.

    FidoDeviceList:
      type: object
      description: List of registered FIDO2 devices for a user (protobuf `FidoDeviceList`).
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/FidoDeviceDto"

    SessionDto:
      type: object
      description: |
        Browser login session record (protobuf `SessionDto`). Only browser sessions are listed;
        Basic and Bearer credential uses do not create sessions and are not included.
        The session secret (cookie value) is never returned; use `public_id` for revocation.
      properties:
        public_id:
          type: string
          description: Opaque identifier used in revocation APIs. Not the cookie secret.
        username:
          type: string
        ip:
          type: string
          description: Client IP address at last activity.
        user_agent:
          type: string
        created_at:
          type: integer
          format: int64
          description: Session creation timestamp as Unix milliseconds.
        last_active:
          type: integer
          format: int64
          description: Last activity timestamp as Unix milliseconds.
        expires_at:
          type: integer
          format: int64
          description: Scheduled expiry as Unix milliseconds.
        current:
          type: boolean
          description: True when this session corresponds to the one making the request.

    SessionList:
      type: object
      description: List of browser sessions for a user (protobuf `SessionList`).
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionDto"

    CreateAccessTokenRequest:
      type: object
      description: |
        Create or update an account (protobuf `CreateAccessTokenRequest`).
        Omit `secret` on create to generate a UUID password; omit on update to keep the existing password.
      properties:
        permissions:
          type: array
          items:
            type: string
        secret:
          type: string
          nullable: true
        new_name:
          type: string
          nullable: true
          minLength: 4
          maxLength: 18
          pattern: '^[A-Za-z0-9_]+$'
          description: Rename the account while retaining its immutable user ID and package ownership.
        nickname:
          type: string
          maxLength: 36
          nullable: true
          description: Public nickname shown in place of the username.
        is_create:
          type: boolean
          description: If true and an account with this name already exists, returns `409 Conflict`.

    CreateAccessTokenResponse:
      type: object
      description: Result of an account create or update operation (protobuf `CreateAccessTokenResponse`).
      properties:
        access_token:
          $ref: "#/components/schemas/AccessTokenDto"
        secret:
          type: string
          description: The plaintext secret, only present when generated or explicitly supplied in this request.

    FileDetails:
      type: object
      description: File or directory metadata node (protobuf `FileDetails`).
      properties:
        type:
          type: string
          enum: [FILE, DIRECTORY]
        name:
          type: string
        content_length:
          type: integer
          format: int64
          nullable: true
        content_type:
          type: string
          nullable: true
        last_modified_time:
          type: string
          nullable: true
          description: RFC3339Nano formatted timestamp.
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileDetails"
          description: Child entries when type is DIRECTORY.

    RepoMirrorInfo:
      type: object
      description: Summary of a configured upstream mirror.
      properties:
        name:
          type: string
        url:
          type: string
        persist:
          type: boolean
        enabled_date:
          type: string
        cache_ttl:
          type: integer
          format: int64
          description: Negative-cache TTL in seconds.
        negative_cache:
          type: boolean

    RepoDetailsResponse:
      type: object
      description: Repository statistics and mirror summary (protobuf `RepoDetailsResponse`).
      properties:
        name:
          type: string
        visibility:
          type: string
          enum: [PUBLIC, HIDDEN, PRIVATE]
        total_size:
          type: integer
          format: int64
        artifact_size:
          type: integer
          format: int64
        metadata_size:
          type: integer
          format: int64
        total_files:
          type: integer
          format: int64
        artifact_count:
          type: integer
          format: int64
        metadata_count:
          type: integer
          format: int64
        mirrors:
          type: array
          items:
            $ref: "#/components/schemas/RepoMirrorInfo"

    VersionsResponse:
      type: object
      description: Version list for a Maven coordinate (protobuf `VersionsResponse`).
      properties:
        is_snapshot:
          type: boolean
        versions:
          type: array
          items:
            type: string

    LatestVersionResponse:
      type: object
      description: Latest resolved version string (protobuf `LatestVersionResponse`).
      properties:
        is_snapshot:
          type: boolean
        version:
          type: string

    PomDetails:
      type: object
      description: POM coordinate fields for on-demand POM generation (protobuf `PomDetails`).
      properties:
        group_id:
          type: string
        artifact_id:
          type: string
        version:
          type: string

    UpdateState:
      type: object
      description: Current state of the online updater. Also embedded in `InstanceStatus`.
      properties:
        status:
          type: string
          enum: [idle, available, downloading, ready_to_restart, error]
        latest_version:
          type: string
        download_url:
          type: string
        progress:
          type: integer
          description: Download progress percentage (0-100).
        error_message:
          type: string
        size:
          type: integer
          format: int64
          description: Download size in bytes.
        estimated_disk_space:
          type: integer
          format: int64
        release_date:
          type: string
        release_notes:
          type: string
        commit_sha:
          type: string
        is_release:
          type: boolean

    InstanceStatus:
      type: object
      description: Real-time process and system metrics (protobuf `InstanceStatus`).
      properties:
        version:
          type: string
        development:
          type: boolean
        uptime:
          type: integer
          format: int64
          description: Milliseconds elapsed since process start.
        used_memory:
          type: integer
          format: int64
          description: Process RSS in bytes (private working set on Windows).
        total_memory:
          type: integer
          format: int64
          description: Total system physical memory in bytes.
        renop_used_disk:
          type: integer
          format: int64
        disk_used:
          type: integer
          format: int64
        disk_total:
          type: integer
          format: int64
        used_threads:
          type: integer
          format: int64
          description: Number of active goroutines.
        available_threads:
          type: integer
          format: int64
        total_threads:
          type: integer
          format: int64
        architecture:
          type: string
          example: amd64
        os:
          type: string
          example: linux
        logical_cores:
          type: integer
        physical_cores:
          type: integer
        failures_count:
          type: integer
          format: int64
          description: Cumulative count of non-2xx responses since process start.
        update_state:
          $ref: "#/components/schemas/UpdateState"
        vss_memory:
          type: integer
          format: int64
          description: Process VSS in bytes (Windows commit charge; Linux max of RSS/private+swap/Go-retained).
        debug_mode:
          type: boolean
          description: True when started with `server.debug_mode` (pprof endpoints active).

    StatusSnapshot:
      type: object
      description: A single historical metrics sample.
      properties:
        timestamp:
          type: integer
          format: int64
          description: Sample time as Unix milliseconds.
        used_memory:
          type: integer
          format: int64
          description: Process RSS in bytes at sample time.
        used_threads:
          type: integer
          format: int64
        open_files:
          type: integer
          format: int64
        vss_memory:
          type: integer
          format: int64

    StatusSnapshotList:
      type: object
      description: Collection of historical metric samples (protobuf `StatusSnapshotList`).
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/StatusSnapshot"

    RuntimeMemoryBreakdown:
      type: object
      description: >
        Debug snapshot of Go MemStats compared to process RSS (protobuf `RuntimeMemoryBreakdown`).
        Useful for explaining off-heap and stack allocations that pprof flame graphs cannot attribute.
      properties:
        note: { type: string }
        process_rss: { type: integer, format: int64 }
        process_vss: { type: integer, format: int64 }
        go_retained: { type: integer, format: int64 }
        heap_inuse: { type: integer, format: int64 }
        heap_alloc: { type: integer, format: int64 }
        heap_sys: { type: integer, format: int64 }
        heap_idle: { type: integer, format: int64 }
        heap_released: { type: integer, format: int64 }
        heap_objects: { type: integer, format: int64 }
        stack_inuse: { type: integer, format: int64 }
        stack_sys: { type: integer, format: int64 }
        mspan_inuse: { type: integer, format: int64 }
        mspan_sys: { type: integer, format: int64 }
        mcache_inuse: { type: integer, format: int64 }
        mcache_sys: { type: integer, format: int64 }
        buck_hash_sys: { type: integer, format: int64 }
        gc_sys: { type: integer, format: int64 }
        other_sys: { type: integer, format: int64 }
        sys: { type: integer, format: int64 }
        off_heap_runtime_estimate: { type: integer, format: int64 }
        rss_minus_go_retained: { type: integer, format: int64 }
        num_goroutine: { type: integer, format: int64 }
        num_cpu: { type: integer, format: int32 }

    RebuildIndexRequest:
      type: object
      description: Parameters for triggering an artifact index rebuild (protobuf `RebuildIndexRequest`).
      required: [mode]
      properties:
        mode:
          type: string
          enum: [full, diff]
          description: |
            `full` re-indexes every file in storage. `diff` indexes only files not already recorded.

    FrontendConfig:
      type: object
      description: Web UI branding and localization settings (protobuf `FrontendConfig`).
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        organization_website:
          type: string
        organization_logo:
          type: string
        background_url:
          type: string
          description: Public WebP image URL (max 5 MiB when set via PUT).
        icp_license:
          type: string
          description: Optional ICP filing number displayed in the footer (China).
        public_security_filing:
          type: string
          description: Optional public security filing number displayed in the footer (China).
        legal_notice_url:
          type: string
          description: Optional absolute HTTP(S) URL linked as the legal notice in the footer.
        font_preset:
          type: string
          enum: [system, inter, noto_sans, open_sans, source_sans, custom]
          description: Locally resolved font stack, or `custom` for asynchronous webfont loading.
        font_url:
          type: string
          description: Direct font-file URL or Google Fonts CSS URL required by the custom preset.

    ServerConfig:
      type: object
      description: HTTP server, TLS, CORS, and database settings (protobuf `ServerConfig`).
      properties:
        host:
          type: string
          example: "0.0.0.0"
        port:
          type: integer
          format: int32
          example: 3000
        ssl_enabled:
          type: boolean
        ssl_cert_path:
          type: string
        ssl_key_path:
          type: string
        domains:
          type: array
          items:
            type: string
          description: Canonical public hostnames. Always included in the CORS allowlist.
          example: ["mvnc.pkg.one", "repo.example.com"]
        enable_compression:
          type: boolean
        file_cache_size_mb:
          type: integer
          format: int32
          description: In-memory LRU artifact cache in MiB. 0 = disabled.
        max_active_requests:
          type: integer
          format: int32
        trusted_proxies:
          type: array
          items:
            type: string
        cdn_ip_header:
          type: string
        cors_origins:
          type: array
          items:
            type: string
          description: >
            Additional CORS origins. Supports host wildcards (`*.pkg.one`), full origins, or `*` for any.
          example: ["*.pkg.one", "https://partner.example.com"]
        debug_mode:
          type: boolean
          description: Persist debug mode flag; restart required to activate pprof endpoints.
        database:
          $ref: "#/components/schemas/DatabaseConfig"
        audit_log:
          $ref: "#/components/schemas/AuditLogConfig"
        gpg:
          $ref: "#/components/schemas/GpgConfig"

    AuditLogConfig:
      type: object
      description: Audit log retention settings, embedded in `ServerConfig`.
      properties:
        retention_days:
          type: integer
          format: int32
          description: Delete audit log entries older than this many days.
        max_rows:
          type: integer
          format: int32
          description: Delete oldest entries when total row count exceeds this limit.

    DatabaseConfig:
      type: object
      description: Database connection settings (protobuf `DatabaseConfig`).
      properties:
        enabled:
          type: boolean
        driver:
          type: string
          enum: [sqlite3, mysql, postgres, clickhouse]
          example: sqlite3
        dsn:
          type: string
          example: renop.db
        max_open_conns:
          type: integer
          format: int32
        max_idle_conns:
          type: integer
          format: int32
        conn_max_lifetime_sec:
          type: integer
          format: int32

    StorageConfig:
      type: object
      description: Artifact storage and documentation preview settings (protobuf `StorageConfig`).
      properties:
        storage_path:
          type: string
        enable_javadoc_preview:
          type: boolean
        javadoc_extract_path:
          type: string
        max_javadoc_size_mb:
          type: integer
          format: int64
          minimum: 1

    UpdaterConfig:
      type: object
      description: Auto-updater channel and mode settings (protobuf `UpdaterConfig`).
      properties:
        channel:
          type: string
          enum: [release, nightly]
        mode:
          type: string
          enum: [manual, auto_check, auto_install, safe_install]

    GpgConfig:
      type: object
      description: Trusted HTTPS key servers for GPG public key resolution.
      required: [key_servers]
      properties:
        key_servers:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            format: uri
          description: HTTPS origins only. Embedded credentials, paths, query strings, and fragments are rejected.

    OutboundProxy:
      type: object
      description: Named outbound proxy definition.
      properties:
        name:
          type: string
        url:
          type: string
          description: Proxy URL (`http://`, `https://`, or `socks5://`). Do not embed credentials.
        username:
          type: string
        password:
          type: string

    ProxyConfig:
      type: object
      description: Named global outbound proxies and the currently active selection (protobuf `ProxyConfig`).
      properties:
        selected:
          type: string
          description: Name of the active proxy. Empty string means direct connection.
        proxies:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/OutboundProxy"

    SettingsDomainsResponse:
      type: object
      description: List of available configuration domain names (protobuf `SettingsDomainsResponse`).
      properties:
        domains:
          type: array
          items:
            type: string
          example: [frontend, server, proxy, storage, updater, index]

    IndexDomainSettings:
      type: object
      description: Empty protobuf placeholder for the `index` configuration domain.

    ChunkedUploadInitRequest:
      type: object
      description: Parameters for initiating a multi-part upload session (protobuf `ChunkedUploadInitRequest`).
      required: [size]
      properties:
        purpose:
          type: string
          enum: [storage, updater]
          default: storage
        filename:
          type: string
        size:
          type: integer
          format: int64
          description: Total file size in bytes.
        path:
          type: string
          description: Destination path for `purpose=storage`.
        generate_checksums:
          type: boolean
          default: false
        chunk_size:
          type: integer
          format: int64
          description: Preferred part size in bytes (server may clamp; default 4 MiB).

    ChunkedUploadInitResponse:
      type: object
      description: Upload session parameters (protobuf `ChunkedUploadInitResponse`).
      properties:
        upload_id:
          type: string
        chunk_size:
          type: integer
          format: int64
        chunk_count:
          type: integer
          format: int32
        purpose:
          type: string

    ChunkedUploadCompleteResponse:
      type: object
      description: Result of a completed multi-part upload (protobuf `ChunkedUploadCompleteResponse`).
      properties:
        status:
          type: string
          description: "`created` for storage; `ready_to_restart` for updater."
        message:
          type: string
        path:
          type: string
          description: Final storage path when `purpose=storage`.

    MirrorCredentials:
      type: object
      properties:
        method:
          type: string
          description: Authentication method (e.g. `basic`, `bearer`).
        login:
          type: string
        password:
          type: string

    Mirror:
      type: object
      description: Upstream mirror configuration for a repository.
      properties:
        name:
          type: string
        url:
          type: string
        persist:
          type: boolean
        cache_ttl_secs:
          type: integer
          format: int64
        negative_cache:
          type: boolean
        timeout_secs:
          type: integer
          format: int64
        authorization:
          $ref: "#/components/schemas/MirrorCredentials"
        enabled_date:
          type: string
        allow_artifacts:
          type: array
          items:
            type: string
          description: Format-aware allowlist. npm accepts exact package names and `@scope/*`; empty permits all.
        deny_artifacts:
          type: array
          items:
            type: string
          description: Format-aware denylist. Allow and deny lists cannot both be active on one mirror.
        proxy:
          type: string
          description: >
            Empty follows the global proxy; `direct` bypasses it; any other value names a proxy
            from the `proxy` domain configuration.

    S3Config:
      type: object
      description: S3-compatible object storage configuration for a repository.
      properties:
        enabled:
          type: boolean
        endpoint:
          type: string
        bucket:
          type: string
        key_prefix:
          type: string
          description: Optional object key prefix within the bucket.
        region:
          type: string
        access_key_id:
          type: string
        secret_access_key:
          type: string
        force_path_style:
          type: boolean
          description: Required for MinIO and most non-AWS providers.
        redirect_downloads:
          type: boolean
          description: Issue pre-signed redirect responses instead of proxying downloads.

    Repository:
      type: object
      description: Repository definition including visibility, upload policy, mirrors, and storage settings.
      properties:
        name:
          type: string
        format:
          type: string
          enum: [maven, maven-classic, files, cargo, docker, npm]
          description: "`maven-classic` uses the file-tree UI but retains verified Maven publication rules. `files` is unstructured storage."
        visibility:
          type: string
          enum: [PUBLIC, HIDDEN, PRIVATE]
        allow_redeployment:
          type: boolean
        require_gpg_signature:
          type: boolean
          description: Require a valid detached OpenPGP signature for every uploaded Maven artifact.
        mirrors:
          type: array
          items:
            $ref: "#/components/schemas/Mirror"
        s3:
          $ref: "#/components/schemas/S3Config"

    SuperTeam:
      type: object
      required: [prefix, name, description, created_by, role_level, member_count, created_at, updated_at]
      properties:
        prefix:
          type: string
          minLength: 2
          maxLength: 64
          pattern: "^[a-z0-9](?:[a-z0-9_-]*[a-z0-9])$"
          description: Immutable namespace shared by every supported package engine.
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 512
        created_by:
          type: string
          description: Current creator username, or the retained creation-time name after account deletion.
        role_level:
          type: integer
          minimum: 0
          maximum: 4
          description: Current account role. Zero is returned only for a system administrator who is not a member.
        member_count:
          type: integer
          minimum: 1
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    SuperTeamMember:
      type: object
      required: [username, level, added_at]
      properties:
        username:
          type: string
        level:
          type: integer
          minimum: 1
          maximum: 4
        added_at:
          type: integer
          format: int64

    SuperTeamDetails:
      type: object
      required: [team, members, administrator]
      properties:
        team:
          $ref: "#/components/schemas/SuperTeam"
        members:
          type: array
          items:
            $ref: "#/components/schemas/SuperTeamMember"
        administrator:
          type: boolean

    SuperTeamLimitStatus:
      type: object
      required: [create_limit, join_limit, created_count, joined_count, create_limit_inherited, join_limit_inherited]
      properties:
        create_limit: { type: integer, minimum: 0, maximum: 1000 }
        join_limit: { type: integer, minimum: 0, maximum: 1000 }
        created_count: { type: integer, minimum: 0 }
        joined_count: { type: integer, minimum: 0 }
        create_limit_inherited: { type: boolean }
        join_limit_inherited: { type: boolean }

    SuperTeamConfig:
      type: object
      required: [create_limit, join_limit]
      properties:
        create_limit: { type: integer, minimum: 1, maximum: 1000, default: 5 }
        join_limit: { type: integer, minimum: 1, maximum: 1000, default: 20 }

    ReviewTask:
      type: object
      required: [id, kind, resource_type, resource_key, resource_name, review_team_prefix, requested_by, status, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [super_team_transfer] }
        resource_type:
          type: string
          enum: [docker_image, npm_package, cargo_package, maven_artifact, maven_domain]
        repository:
          type: string
          description: Empty for process-wide Maven publishing domains.
        resource_key:
          type: string
          maxLength: 1024
        resource_name:
          type: string
          maxLength: 512
        source_team_prefix: { type: string, maxLength: 64 }
        target_team_prefix: { type: string, maxLength: 64 }
        review_team_prefix: { type: string, maxLength: 64 }
        requested_by: { type: string }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        decision_reason:
          type: string
          maxLength: 512
          description: Present only for a user-entered rejection reason or an internal cancellation record.
        decided_by: { type: string }
        created_at: { type: integer, format: int64 }
        decided_at: { type: integer, format: int64 }

    ReviewTaskPage:
      type: object
      required: [tasks, total, limit, offset, view]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/ReviewTask" }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
        view: { type: string, enum: [reviewer, requested] }

    SuperTeamTransferReviewRequest:
      type: object
      required: [resource_type, resource_key, target_team_prefix]
      properties:
        resource_type:
          type: string
          enum: [docker_image, npm_package, cargo_package, maven_artifact, maven_domain]
        repository:
          type: string
          description: Required for package and image resources; omitted for Maven publishing domains.
        resource_key:
          type: string
          description: Canonical package name, image name, domain, or `groupId:artifactId` coordinate.
        target_team_prefix:
          type: string
          maxLength: 64
          description: Target team for transfer-in; empty for a return to personal ownership.

    MavenDomain:
      type: object
      required: [domain, verification_type, verification_host, verified, created_at, permission_level, artifact_count, repository_count, member_count]
      properties:
        domain:
          type: string
          example: com.example
        verification_type:
          type: string
          enum: [dns, github, gitlab, legacy]
        verification_host:
          type: string
          description: Registered DNS root or public GitHub/GitLab account.
        verification_code:
          type: string
          description: Present only for L3/L4 members and administrators.
        super_team_prefix:
          type: string
          maxLength: 64
          description: Optional global team whose mapped role participates in domain authorization.
        verified:
          type: boolean
        created_at:
          type: integer
          format: int64
        verified_at:
          type: integer
          format: int64
        last_check_at:
          type: integer
          format: int64
        permission_level:
          type: integer
          minimum: 0
          maximum: 4
        member:
          type: boolean
          description: Whether the current account belongs to this domain, including at L0.
        artifact_count:
          type: integer
          minimum: 0
          description: Global count for domain members and administrators; repository list endpoints return the visible repository-local count.
        repository_count:
          type: integer
          minimum: 0
          description: Number of Maven repositories containing artifacts under this global domain. Zeroed for non-members to avoid disclosing private repositories.
        member_count:
          type: integer
          minimum: 0

    MavenMember:
      type: object
      required: [user_id, username, level, added_at]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        level:
          type: integer
          minimum: 0
          maximum: 4
        added_at:
          type: integer
          format: int64

    MavenDomainDetails:
      type: object
      required: [domain, administrator]
      properties:
        domain:
          $ref: "#/components/schemas/MavenDomain"
        members:
          type: array
          items:
            $ref: "#/components/schemas/MavenMember"
        administrator:
          type: boolean

    MavenArtifact:
      type: object
      required: [repository, domain, group_id, artifact_id, version_count, total_size, mirrored, created_at, updated_at]
      properties:
        repository:
          type: string
        domain:
          type: string
        group_id:
          type: string
        artifact_id:
          type: string
        super_team_prefix:
          type: string
          maxLength: 64
          description: Optional global-team project owner. Mapped members are not repeated in package member lists.
        description:
          type: string
          maxLength: 4000
        readme:
          type: string
          maxLength: 524288
          description: Bounded Markdown documentation returned only by artifact-detail responses.
        publisher:
          type: string
        latest_version:
          type: string
        version_count:
          type: integer
          minimum: 0
        total_size:
          type: integer
          format: int64
          minimum: 0
          description: Sum of cataloged version sizes in bytes.
        mirrored:
          type: boolean
          description: True when at least one cataloged version was obtained from an upstream mirror.
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        permission_level:
          type: integer
          minimum: 0
          maximum: 4

    MavenVersion:
      type: object
      required: [version, size, mirrored, created_at]
      properties:
        version:
          type: string
        publisher:
          type: string
        size:
          type: integer
          format: int64
        mirrored:
          type: boolean
          description: True when this version was obtained from an upstream mirror.
        created_at:
          type: integer
          format: int64
        file_count:
          type: integer
          minimum: 0
          description: Number of indexed primary files, excluding checksum and signature companions.
        total_file_size:
          type: integer
          format: int64
          minimum: 0
          description: Sum of indexed primary-file sizes.
        signed_file_count:
          type: integer
          minimum: 0
        last_modified:
          type: integer
          format: int64
        files:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/MavenVersionFile"
        files_truncated:
          type: boolean

    MavenVersionFile:
      type: object
      required: [name, size, signed]
      properties:
        name:
          type: string
        extension:
          type: string
        classifier:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        modified_at:
          type: integer
          format: int64
        signed:
          type: boolean
        checksums:
          type: array
          items:
            type: string
            enum: [MD5, SHA-1, SHA-256, SHA-512]

    MavenProjectMetadata:
      type: object
      description: Bounded metadata parsed from the latest indexed POM when that POM is at most 2 MiB.
      properties:
        model_version:
          type: string
        name:
          type: string
        description:
          type: string
        packaging:
          type: string
        url:
          type: string
        inception_year:
          type: string
        parent:
          $ref: "#/components/schemas/MavenProjectCoordinate"
        organization_name:
          type: string
        organization_url:
          type: string
        scm_url:
          type: string
        issue_management_system:
          type: string
        issue_management_url:
          type: string
        licenses:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/MavenProjectLicense"
        developers:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/MavenProjectDeveloper"
        dependencies:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/MavenProjectDependency"
        dependencies_truncated:
          type: boolean
        managed_dependency_count:
          type: integer
          minimum: 0

    MavenProjectCoordinate:
      type: object
      properties:
        group_id:
          type: string
        artifact_id:
          type: string
        version:
          type: string

    MavenProjectLicense:
      type: object
      properties:
        name:
          type: string
        url:
          type: string

    MavenProjectDeveloper:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        organization:
          type: string
        organization_url:
          type: string
        roles:
          type: array
          maxItems: 8
          items:
            type: string

    MavenProjectDependency:
      type: object
      properties:
        group_id:
          type: string
        artifact_id:
          type: string
        version:
          type: string
        scope:
          type: string
        type:
          type: string
        classifier:
          type: string
        optional:
          type: boolean

    MavenArtifactDetails:
      type: object
      required: [artifact, versions, administrator]
      properties:
        artifact:
          $ref: "#/components/schemas/MavenArtifact"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/MavenVersion"
        project:
          $ref: "#/components/schemas/MavenProjectMetadata"
        file_count:
          type: integer
          minimum: 0
        total_file_size:
          type: integer
          format: int64
          minimum: 0
        signed_file_count:
          type: integer
          minimum: 0
        administrator:
          type: boolean

    DownloadStatisticRecord:
      type: object
      required: [count, bytes, updated_at]
      properties:
        username:
          type: string
        repository:
          type: string
        format:
          type: string
          enum: [maven, files, cargo, docker, npm]
        namespace:
          type: string
          description: Verified Maven publishing domain or npm scope when applicable.
        package:
          type: string
          description: Maven coordinate, npm package, Cargo crate, Docker image, or unstructured file path.
        version:
          type: string
        count:
          type: integer
          format: int64
          minimum: 0
        bytes:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: integer
          format: int64

    DownloadStatisticsPage:
      type: object
      required: [group_by, count, bytes, records, total, limit, offset]
      properties:
        group_by:
          type: string
          enum: [user, repository, namespace, package, version]
        count:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
        records:
          type: array
          items:
            $ref: "#/components/schemas/DownloadStatisticRecord"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    DockerRepositoryImage:
      type: object
      required: [repository, image_name, description, publisher, tag_count, pull_count, private, push_enabled, mirrored, created_at, updated_at]
      properties:
        repository:
          type: string
        image_name:
          type: string
          maxLength: 255
          example: team/service
        super_team_prefix:
          type: string
          maxLength: 64
          description: Optional global-team project owner. Namespaced images must match this prefix.
        description:
          type: string
          maxLength: 524288
          description: Bounded Markdown README for the container image.
        publisher:
          type: string
        tag_count:
          type: integer
          minimum: 0
        latest_tag:
          type: string
        pull_count:
          type: integer
          format: int64
        private:
          type: boolean
          description: Private images require an explicit L0-L4 member, a mapped global-team member, or administrator access.
        push_enabled:
          type: boolean
          description: False for mirror-discovered images, whose names cannot be reserved for local pushes.
        mirrored:
          type: boolean
          description: True for images discovered and cached through an upstream registry mirror.
        permission_level:
          type: integer
          minimum: 0
          maximum: 4
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    NPMPackage:
      type: object
      description: Reserved local package or pull-only package discovered through an npm mirror.
      required: [repository, name, description, publisher, latest_version, version_count, private, archived, mirrored, publish_enabled, created_at, updated_at]
      properties:
        repository:
          type: string
        name:
          type: string
          maxLength: 214
          example: "@example/library"
        super_team_prefix:
          type: string
          maxLength: 64
          description: Optional global-team project owner. Scoped packages must match this prefix.
        description:
          type: string
          maxLength: 4000
        publisher:
          type: string
        latest_version:
          type: string
        version_count:
          type: integer
          minimum: 0
        private:
          type: boolean
          description: Private packages must be scoped and require mapped global-team, explicit package, or administrator access.
        archived:
          type: boolean
        mirrored:
          type: boolean
          description: Mirrored packages are pull-only and cannot receive local publications.
        publish_enabled:
          type: boolean
        permission_level:
          type: integer
          minimum: 0
          maximum: 4
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    NPMVersion:
      type: object
      required: [version, publisher, shasum, integrity, size, unpublished, mirrored, created_at]
      properties:
        version:
          type: string
          example: 1.2.3
        publisher:
          type: string
        shasum:
          type: string
          description: Lowercase SHA-1 digest retained for npm client compatibility.
        integrity:
          type: string
          description: Subresource Integrity value using SHA-512.
        size:
          type: integer
          format: int64
          minimum: 0
        deprecated:
          type: string
          maxLength: 4000
        unpublished:
          type: boolean
        mirrored:
          type: boolean
        created_at:
          type: integer
          format: int64

    NPMMember:
      type: object
      required: [user_id, username, level, added_at]
      properties:
        user_id:
          type: string
          format: uuid
          description: Immutable internal identity; clients should display `username`.
        username:
          type: string
        level:
          type: integer
          minimum: 0
          maximum: 4
        added_at:
          type: integer
          format: int64

    NPMProjectPerson:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        url:
          type: string
          format: uri

    NPMProjectMetadata:
      type: object
      description: Bounded presentation metadata parsed from the selected published version.
      properties:
        readme:
          type: string
          maxLength: 524288
        readme_filename:
          type: string
        license:
          type: string
        homepage:
          type: string
          format: uri
        repository:
          type: string
          format: uri
        bugs:
          type: string
          format: uri
        author:
          $ref: "#/components/schemas/NPMProjectPerson"
        contributors:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/NPMProjectPerson"
        maintainers:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/NPMProjectPerson"
        funding:
          type: array
          maxItems: 16
          items:
            type: string
            format: uri
        keywords:
          type: array
          maxItems: 64
          items:
            type: string
        node_engine:
          type: string
        package_manager:
          type: string

    NPMPackageDetails:
      type: object
      required: [package, versions, dist_tags, member_count, member, administrator]
      properties:
        package:
          $ref: "#/components/schemas/NPMPackage"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/NPMVersion"
        dist_tags:
          type: object
          additionalProperties:
            type: string
        members:
          type: array
          description: Present for L3/L4 package members and administrators.
          items:
            $ref: "#/components/schemas/NPMMember"
        project:
          $ref: "#/components/schemas/NPMProjectMetadata"
        member:
          type: boolean
          description: Whether the current account has an explicit L0-L4 package membership.
        member_count:
          type: integer
          minimum: 0
        administrator:
          type: boolean

    NPMPackagePage:
      type: object
      required: [repository, packages, total, limit, offset]
      properties:
        repository:
          type: string
        packages:
          type: array
          items:
            $ref: "#/components/schemas/NPMPackage"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0

    NPMRegistryError:
      type: object
      required: [error, reason]
      properties:
        error:
          type: string
        reason:
          type: string

    NPMOperationResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        id:
          type: string
        rev:
          type: string

    MavenRepositoriesResponse:
      type: object
      description: All repository configurations keyed by name (protobuf `MavenRepositoriesResponse`).
      properties:
        repositories:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Repository"

    CheckResult:
      type: object
      description: Result of an update availability check.
      properties:
        has_update:
          type: boolean
        current_version:
          type: string
        latest_version:
          type: string
        download_url:
          type: string
        channel:
          type: string
        size:
          type: integer
          format: int64
        estimated_disk_space:
          type: integer
          format: int64
        release_date:
          type: string
        release_notes:
          type: string
        commit_sha:
          type: string
        is_release:
          type: boolean

    InstallStarted:
      type: object
      description: Acknowledgement that an online update download has been initiated.
      properties:
        status:
          type: string
          example: started

    OfflineInstallResult:
      type: object
      description: Result of an offline update package installation.
      properties:
        status:
          type: string
          example: ready_to_restart
        message:
          type: string

    Restarting:
      type: object
      description: Acknowledgement that the process restart sequence has been initiated.
      properties:
        status:
          type: string
          example: restarting

    MessageDto:
      type: object
      description: A single user inbox message (protobuf `UserMessage`).
      properties:
        id:
          type: string
          format: uuid
        recipient:
          type: string
        sender:
          type: string
        kind:
          type: string
          description: Message category (`announcement`, `team_invite`, `system`).
        severity:
          type: string
          enum: [info, success, warning, error]
        title:
          type: string
          maxLength: 240
        body:
          type: string
          maxLength: 8000
        payload:
          type: object
          description: Kind-specific structured payload (JSON).
        read_at:
          type: integer
          format: int64
          nullable: true
          description: Unix milliseconds when marked read; null if unread.
        expires_at:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: integer
          format: int64
        action_status:
          type: string
          nullable: true
          description: Lifecycle status of an associated action (e.g. `pending`, `accepted`, `declined`).

    MessageListResponse:
      type: object
      description: Paginated message list (protobuf `UserMessageList`).
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageDto"
        unread_count:
          type: integer
          format: int64
        next_cursor:
          type: string
          nullable: true
          description: Opaque base64url cursor for the next page; absent when no further pages exist.

    UnreadCountResponse:
      type: object
      description: Unread message count (protobuf `UnreadCountResponse`).
      properties:
        count:
          type: integer
          format: int64

    MarkAllReadResponse:
      type: object
      description: Result of marking all messages read (protobuf `MarkAllReadResponse`).
      properties:
        updated:
          type: integer
          format: int64
          description: Number of messages transitioned to read.

    ClearMessagesResponse:
      type: object
      description: Result of clearing all messages (protobuf `ClearMessagesResponse`).
      properties:
        deleted:
          type: integer
          format: int64

    SendNotificationRequest:
      type: object
      description: |
        Admin broadcast notification request (`application/x-protobuf` or `application/json`).
        Provide either `all: true` or a non-empty `recipients` list.
      properties:
        recipients:
          type: array
          items:
            type: string
          maxItems: 100
        all:
          type: boolean
        severity:
          type: string
          enum: [info, success, warning, error]
          default: info
        title:
          type: string
          maxLength: 240
        body:
          type: string
          maxLength: 8000

    SendNotificationResponse:
      type: object
      description: Result of an admin broadcast (protobuf `SendNotificationResponse`).
      properties:
        delivered:
          type: integer
          format: int64

    UserSearchResponse:
      type: object
      description: Account name suggestions for notification targeting (protobuf `UserSearchResponse`).
      properties:
        users:
          type: array
          items:
            type: string
          maxItems: 8

    AuditLogEntry:
      type: object
      description: A single immutable audit log record.
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          description: The account whose resource or data was affected.
        operator:
          type: string
          description: |
            The account that performed the action. Masked as `"Administrator"` in the self-view endpoint.
        action:
          type: string
          description: Machine-readable action code (e.g. `LOGIN`, `LOGOUT`, `MESSAGE_SEND`, `LOG_CLEAR`).
        details:
          type: string
        auth_method:
          type: string
          description: Authentication method used (`session`, `basic`, `bearer`).
        session_id:
          type: string
          nullable: true
        ip:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds timestamp.

    AuditLogListResponse:
      type: object
      description: Paginated audit log (protobuf `AuditLogList`).
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        page_size:
          type: integer
          format: int32

    OciErrorDetail:
      type: object
      description: A single OCI Distribution Specification error entry.
      properties:
        code:
          type: string
          description: Machine-readable error code (e.g. `UNAUTHORIZED`, `NAME_UNKNOWN`, `BLOB_UNKNOWN`).
        message:
          type: string
        detail:
          type: object

    OciErrorList:
      type: object
      description: OCI Distribution Specification error envelope.
      required: [errors]
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/OciErrorDetail"

    CargoErrorDetail:
      type: object
      description: A single Cargo registry API error entry.
      properties:
        detail:
          type: string

    CargoErrorList:
      type: object
      description: Cargo registry API error envelope.
      required: [errors]
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/CargoErrorDetail"
# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  # ========== Auth ==========
  /api/auth/login:
    post:
      tags: [auth]
      summary: Password login
      description: |
        Authenticates with username and password and creates a browser session.
        The session id is delivered exclusively via `Set-Cookie`; `session_token` is empty for cookie logins.
      operationId: postAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "`renop_session=<id>; HttpOnly; SameSite=Lax; Max-Age=604800`"
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/SessionDetails"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"
        "403":
          $ref: "#/components/responses/PlainForbidden"

  /api/auth/me:
    get:
      tags: [auth]
      summary: Current session details
      description: Returns `SessionDetails` for the authenticated session.
      operationId: getAuthMe
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session details.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/SessionDetails"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Logout
      description: Invalidates the current session and clears the session cookie. Returns 204 even if no session existed.
      operationId: postAuthLogout
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session invalidated.

  /api/users/{username}/profile:
    get:
      tags: [auth]
      summary: Get a public user profile
      operationId: getPublicUserProfile
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /api/users/{username}/memberships:
    get:
      tags: [auth]
      summary: List a user's visible package and Maven-domain teams
      description: Private packages require viewer access. Hidden repositories remain omitted unless the viewer has repository-browser permission.
      operationId: getPublicUserMemberships
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [maven, cargo, docker, npm]
      responses:
        "200":
          description: Visible package memberships and their team roles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberships:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserPackageMembership"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /api/users/profiles:
    get:
      tags: [auth]
      summary: Get a batch of public user profiles
      description: Returns existing accounts from a bounded batch of at most 50 comma-separated usernames.
      operationId: getPublicUserProfiles
      parameters:
        - name: names
          in: query
          required: true
          schema:
            type: string
          example: alice,bob
      responses:
        "200":
          description: Existing profiles in requested order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/PlainBadRequest"

  /api/auth/profile:
    get:
      tags: [auth]
      summary: Get the current user's editable profile state
      operationId: getOwnUserProfile
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Own profile with rename quota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"
    put:
      tags: [auth]
      summary: Update nickname or username
      description: |
        Nicknames are limited to 36 Unicode code points. A replacement username must contain 4–18 ASCII letters,
        digits, or underscores and must be unique. At most two successful username changes are permitted in each
        durable 24-hour window; nickname-only updates do not consume the quota.
      operationId: putOwnUserProfile
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdateRequest"
      responses:
        "200":
          description: Updated profile and remaining rename quota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"
        "409":
          description: Username is already in use.
        "413":
          description: Profile request exceeds 1 KiB.
        "429":
          description: Both username changes in the current 24-hour window have been used.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the current rename window resets.

  /api/auth/profile/password:
    put:
      tags: [auth]
      summary: Change own password
      operationId: putAuthProfilePassword
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              $ref: "#/components/schemas/UpdatePasswordRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordRequest"
      responses:
        "200":
          description: Password updated.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/auth/profile/token:
    post:
      tags: [auth]
      summary: Create an additional publishing token (compatibility endpoint)
      description: Creates a non-expiring API token with `repository:read` and `repository:publish`; existing tokens remain valid.
      operationId: postAuthProfileToken
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "New publishing API token. Returned once with Cache-Control: no-store."
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/GenerateTokenResponse"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/auth/profile/api-tokens:
    get:
      tags: [auth]
      summary: List own API-token metadata
      description: Returns bounded non-secret metadata. Plaintext credentials are never returned by list operations.
      operationId: getAuthProfileApiTokens
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Token metadata and the per-account limit.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenListResponse"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"
    post:
      tags: [auth]
      summary: Create an API token
      description: |
        Creates a named credential with an optional expiration. Requested scopes must be assignable by the account;
        every request is also capped by the account's current permissions. The secret is shown exactly once.
      operationId: postAuthProfileApiToken
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenRequest"
      responses:
        "201":
          description: Token created. Store the one-time secret before discarding this response.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPITokenResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"
        "409":
          $ref: "#/components/responses/PlainConflict"

  /api/auth/profile/api-tokens/scopes:
    get:
      tags: [auth]
      summary: List scopes assignable by the current account
      operationId: getAuthProfileApiTokenScopes
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Scope catalog filtered by current account permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenScopesResponse"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/auth/profile/api-tokens/{token_id}:
    delete:
      tags: [auth]
      summary: Revoke an API token
      description: Revocation takes effect immediately, including for cached authentication results.
      operationId: deleteAuthProfileApiToken
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/APITokenId"
      responses:
        "204":
          description: Token revoked.
        "401":
          $ref: "#/components/responses/PlainUnauthorized"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /api/auth/profile/fido:
    get:
      tags: [auth]
      summary: List own FIDO2 devices
      operationId: getAuthProfileFido
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Registered device list.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/FidoDeviceList"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/auth/profile/fido/{device_id}:
    delete:
      tags: [auth]
      summary: Delete own FIDO2 device
      operationId: deleteAuthProfileFidoDevice
      security:
        - sessionCookie: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device removed.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/auth/profile/fido/register/begin:
    post:
      tags: [auth]
      summary: Begin FIDO2 device registration
      description: |
        Starts a WebAuthn registration ceremony. Returns `session_id` and
        `PublicKeyCredentialCreationOptions` to pass to `navigator.credentials.create()`.
      operationId: postAuthProfileFidoRegisterBegin
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Registration challenge started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  options:
                    type: object
                    description: WebAuthn `PublicKeyCredentialCreationOptions`.
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/auth/profile/fido/register/finish:
    post:
      tags: [auth]
      summary: Finish FIDO2 device registration
      operationId: postAuthProfileFidoRegisterFinish
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, name, credential]
              properties:
                session_id:
                  type: string
                name:
                  type: string
                  description: Human-readable label for the device.
                credential:
                  type: object
                  description: Browser-generated `PublicKeyCredential` JSON.
      responses:
        "200":
          description: Device registered.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/FidoDeviceDto"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/auth/fido/login/begin:
    post:
      tags: [auth]
      summary: Begin FIDO2 passwordless login
      description: |
        Starts a WebAuthn authentication ceremony. An optional `username` scopes the challenge;
        omit for usernameless (resident key) flows.
      operationId: postAuthFidoLoginBegin
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
      responses:
        "200":
          description: Authentication challenge started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  options:
                    type: object
                    description: WebAuthn `PublicKeyCredentialRequestOptions`.
        "400":
          $ref: "#/components/responses/PlainBadRequest"

  /api/auth/fido/login/finish:
    post:
      tags: [auth]
      summary: Finish FIDO2 passwordless login
      description: Completes WebAuthn authentication. On success issues the `renop_session` cookie.
      operationId: postAuthFidoLoginFinish
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, credential]
              properties:
                session_id:
                  type: string
                credential:
                  type: object
      responses:
        "200":
          description: Authenticated.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/SessionDetails"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/auth/profile/sessions:
    get:
      tags: [auth]
      summary: List own browser sessions
      description: |
        Returns browser login sessions for the authenticated user. Basic/Bearer uses are not listed.
        Session secrets are never returned; use `public_id` to revoke.
      operationId: getAuthProfileSessions
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session list.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/auth/profile/sessions/revoke-others:
    post:
      tags: [auth]
      summary: Revoke all other own sessions
      description: |
        Revokes every browser session for the authenticated user except the one making this request.
        If using Basic/Bearer auth (no session), all browser sessions are revoked.
      operationId: postAuthProfileSessionsRevokeOthers
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Other sessions revoked.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/auth/profile/sessions/{session_id}:
    delete:
      tags: [auth]
      summary: Revoke one own session
      description: Revokes a session by `public_id`. Unknown IDs are a no-op. Revoking the current session clears the cookie.
      operationId: deleteAuthProfileSession
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SessionPublicId"
      responses:
        "200":
          description: Session revoked.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  # ========== Tokens ==========
  /api/tokens:
    get:
      tags: [tokens]
      summary: List all accounts
      description: Returns all registered accounts. Requires the `manager` permission.
      operationId: getTokens
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Account list.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/AccessTokenList"
        "403":
          $ref: "#/components/responses/PlainForbidden"

  /api/tokens/{name}:
    get:
      tags: [tokens]
      summary: Get one account
      operationId: getToken
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenName"
      responses:
        "200":
          description: Account descriptor.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/AccessTokenDto"
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "404":
          $ref: "#/components/responses/PlainNotFound"
    put:
      tags: [tokens]
      summary: Create or update account
      description: |
        Creates or updates an account. Set `is_create: true` to return 409 if the account already exists.
        Requires the `manager` permission.
      operationId: putToken
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenName"
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              $ref: "#/components/schemas/CreateAccessTokenRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessTokenRequest"
      responses:
        "200":
          description: Account created or updated.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/CreateAccessTokenResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "404":
          $ref: "#/components/responses/PlainNotFound"
        "409":
          $ref: "#/components/responses/PlainConflict"
    delete:
      tags: [tokens]
      summary: Delete account
      description: Permanently removes an account and all associated sessions. Requires the `manager` permission.
      operationId: deleteToken
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenName"
      responses:
        "204":
          description: Account deleted.
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /api/tokens/{name}/sessions:
    get:
      tags: [tokens]
      summary: List sessions for a user (manager)
      description: Returns all browser sessions for the named account. Requires the `manager` permission.
      operationId: getTokenUserSessions
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenName"
      responses:
        "200":
          description: Session list.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/SessionList"
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /api/tokens/{name}/sessions/revoke-all:
    post:
      tags: [tokens]
      summary: Revoke all sessions for a user (manager)
      description: |
        Revokes all browser sessions for the named account. If targeting their own account,
        the requesting session is preserved. Requires the `manager` permission.
      operationId: postTokenUserSessionsRevokeAll
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenName"
      responses:
        "200":
          description: Sessions revoked.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "403":
          $ref: "#/components/responses/PlainForbidden"

  /api/tokens/{name}/sessions/{session_id}:
    delete:
      tags: [tokens]
      summary: Revoke one session for a user (manager)
      description: Revokes a specific session by `public_id`. Unknown IDs are a no-op. Requires the `manager` permission.
      operationId: deleteTokenUserSession
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenName"
        - $ref: "#/components/parameters/SessionPublicId"
      responses:
        "200":
          description: Session revoked.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "403":
          $ref: "#/components/responses/PlainForbidden"

  /api/auth/users/{username}/fido:
    get:
      tags: [tokens]
      summary: List FIDO2 devices for a user (manager)
      operationId: getAuthUserFidoDevices
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device list.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/FidoDeviceList"
        "403":
          $ref: "#/components/responses/PlainForbidden"

  /api/auth/users/{username}/fido/{device_id}:
    delete:
      tags: [tokens]
      summary: Delete FIDO2 device for a user (manager)
      operationId: deleteAuthUserFidoDevice
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device removed.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "403":
          $ref: "#/components/responses/PlainForbidden"

  # ========== Status ==========
  /api/status/health:
    get:
      tags: [status]
      summary: Health probe
      description: Returns `"UP"` when the process is serving. Suitable for load balancer health checks.
      operationId: getStatusHealth
      security: []
      responses:
        "200":
          description: Process is healthy.
          content:
            application/json:
              schema:
                type: string
                example: UP

  /api/status/hash:
    get:
      tags: [status]
      summary: Frontend asset content hash
      description: Returns a hash of the embedded frontend assets. Used by clients to detect when a UI reload is needed.
      operationId: getStatusHash
      security: []
      responses:
        "200":
          description: Content hash string.
          content:
            application/json:
              schema:
                type: string

  /api/status/instance:
    get:
      tags: [status]
      summary: Instance runtime status
      description: Returns real-time process metrics including memory, goroutines, disk, CPU, and the current update state.
      operationId: getStatusInstance
      security: []
      responses:
        "200":
          description: Instance metrics.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/InstanceStatus"

  /api/status/snapshots:
    get:
      tags: [status]
      summary: Historical metric snapshots
      description: Returns a time-series of metric samples. Returns an empty list if none have been collected yet.
      operationId: getStatusSnapshots
      security: []
      responses:
        "200":
          description: Metric snapshot list.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/StatusSnapshotList"

  # ========== Debug ==========
  /api/debug/memory/heap:
    get:
      tags: [debug]
      summary: Go heap pprof profile
      description: |
        Returns a binary pprof heap profile. Open with `go tool pprof` or Speedscope.
        Runs GC before sampling by default; pass `?gc=0` to skip.
        Requires `manager` permission and `server.debug_mode` enabled at process start.
      operationId: getDebugMemoryHeap
      parameters:
        - name: gc
          in: query
          schema:
            type: string
            enum: ["0", "1"]
            default: "1"
          description: Set to `0` to skip GC before sampling.
      responses:
        "200":
          description: Binary pprof profile.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Not a manager or debug mode is not active.

  /api/debug/memory/allocs:
    get:
      tags: [debug]
      summary: Go allocs pprof profile
      description: Requires `manager` permission and `server.debug_mode` enabled at process start.
      operationId: getDebugMemoryAllocs
      responses:
        "200":
          description: Binary pprof profile.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Not a manager or debug mode is not active.

  /api/debug/memory/goroutine:
    get:
      tags: [debug]
      summary: Go goroutine pprof profile
      description: Requires `manager` permission and `server.debug_mode` enabled at process start.
      operationId: getDebugMemoryGoroutine
      responses:
        "200":
          description: Binary pprof profile.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Not a manager or debug mode is not active.

  /api/debug/memory/runtime:
    get:
      tags: [debug]
      summary: Runtime memory breakdown
      description: |
        Returns a `RuntimeMemoryBreakdown` protobuf explaining stack and off-heap totals.
        Pass `?gc=1` to run GC before sampling.
        Requires `manager` permission and `server.debug_mode` enabled at process start.
      operationId: getDebugMemoryRuntime
      parameters:
        - name: gc
          in: query
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
          description: Set to `1` to run GC before sampling.
      responses:
        "200":
          description: Runtime memory breakdown.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/RuntimeMemoryBreakdown"
        "403":
          description: Not a manager or debug mode is not active.

  # ========== Global teams ==========
  /api/super-teams:
    get:
      tags: [super-teams]
      summary: List visible global teams
      description: Returns the caller's teams in immutable-prefix order. System administrators see every team.
      operationId: listSuperTeams
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 12 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Bounded team page.
          content:
            application/json:
              schema:
                type: object
                required: [teams, total, limit, offset, administrator]
                properties:
                  teams: { type: array, items: { $ref: "#/components/schemas/SuperTeam" } }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }
                  administrator: { type: boolean }
    post:
      tags: [super-teams]
      summary: Create a global team
      description: Reserves an immutable cross-engine prefix and assigns the caller T4 ownership.
      operationId: createSuperTeam
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefix, name, description]
              properties:
                prefix: { type: string, minLength: 2, maxLength: 64 }
                name: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 512 }
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperTeam" }
        "409":
          description: Prefix already exists or the caller reached a creation/membership limit.

  /api/super-teams/eligible:
    get:
      tags: [super-teams]
      summary: List global teams eligible to own a resource
      description: Returns only memberships at or above the requested role; administrator status does not bypass membership.
      operationId: listEligibleSuperTeams
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - { name: minimum_role, in: query, schema: { type: integer, minimum: 1, maximum: 4, default: 3 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 12 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Bounded eligible-team page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams: { type: array, items: { $ref: "#/components/schemas/SuperTeam" } }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }

  /api/super-teams/{prefix}:
    parameters:
      - name: prefix
        in: path
        required: true
        schema: { type: string, minLength: 2, maxLength: 64 }
    get:
      tags: [super-teams]
      summary: Get a global team
      operationId: getSuperTeam
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Team metadata and username-only member list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperTeamDetails" }
        "404": { $ref: "#/components/responses/PlainNotFound" }
    put:
      tags: [super-teams]
      summary: Update mutable global-team metadata
      description: T4 owners and system administrators may change the name and description; the prefix is immutable.
      operationId: updateSuperTeam
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description]
              properties:
                name: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 512 }
      responses:
        "200":
          description: Updated team details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperTeamDetails" }
    delete:
      tags: [super-teams]
      summary: Delete a global team
      description: T4 owners and system administrators may delete a team only when it owns no resources and has no pending transfer. Pending invitations are cancelled atomically.
      operationId: deleteSuperTeam
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "204": { description: Team deleted. }

  /api/super-teams/{prefix}/members:
    post:
      tags: [super-teams]
      summary: Invite or administratively add members
      description: T3 can invite T1/T2; T4 can invite T1-T4. System administrators add immediately and still enforce account membership limits.
      operationId: addSuperTeamMembers
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: prefix
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users, level]
              properties:
                users:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string }
                level: { type: integer, minimum: 1, maximum: 4 }
      responses:
        "201": { description: Invitations sent or members added. }
        "409": { description: Existing membership/invitation or target membership limit reached. }

  /api/super-teams/{prefix}/members/{username}:
    parameters:
      - { name: prefix, in: path, required: true, schema: { type: string } }
      - { name: username, in: path, required: true, schema: { type: string } }
    put:
      tags: [super-teams]
      summary: Change a global-team role
      description: T3 can manage only T1/T2. T4 and system administrators may manage T1-T4. The last T4 cannot be demoted.
      operationId: updateSuperTeamMember
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { type: integer, minimum: 1, maximum: 4 }
      responses:
        "200": { description: Role updated. }
        "409": { description: The operation would remove the last T4 owner. }
    delete:
      tags: [super-teams]
      summary: Remove a member or leave a global team
      operationId: removeSuperTeamMember
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "204": { description: Member removed. }
        "409": { description: The operation would remove the last T4 owner. }

  /api/super-teams/invitations/{id}/{decision}:
    post:
      tags: [super-teams]
      summary: Respond to a global-team invitation
      operationId: respondSuperTeamInvitation
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: decision, in: path, required: true, schema: { type: string, enum: [accept, reject] } }
      responses:
        "200": { description: Invitation answered exactly once. }
        "409": { description: Invitation expired, was already answered, or membership limit was reached. }

  /api/super-teams/limits:
    get:
      tags: [super-teams]
      summary: Get current account global-team limits
      operationId: getOwnSuperTeamLimits
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Effective limits, inheritance flags, and usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperTeamLimitStatus" }

  /api/super-teams/users/{username}/limits:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
    get:
      tags: [super-teams]
      summary: Get one account's effective global-team limits
      operationId: getUserSuperTeamLimits
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Effective account limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperTeamLimitStatus" }
    put:
      tags: [super-teams]
      summary: Override one account's global-team limits
      description: Manager-only. Use `-1` to inherit the corresponding global value; zero prevents the operation.
      operationId: updateUserSuperTeamLimits
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [create_limit, join_limit]
              properties:
                create_limit: { type: integer, minimum: -1, maximum: 1000 }
                join_limit: { type: integer, minimum: -1, maximum: 1000 }
      responses:
        "200":
          description: Updated effective account limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperTeamLimitStatus" }

  /api/settings/super-teams:
    get:
      tags: [settings, super-teams]
      summary: Get global team defaults
      operationId: getSuperTeamSettings
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Global defaults.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperTeamConfig" }
    put:
      tags: [settings, super-teams]
      summary: Update global team defaults
      operationId: updateSuperTeamSettings
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuperTeamConfig" }
      responses:
        "200":
          description: Updated global defaults.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperTeamConfig" }

  # ========== Independent reviews ==========
  /api/reviews:
    get:
      tags: [reviews]
      summary: List ownership review tasks
      description: >
        Returns a bounded reviewer or requester page. Reviewer pages contain only tasks for teams where the caller is
        currently T3 or T4. This route accepts a browser session only; Basic credentials and Bearer API tokens are denied.
      operationId: listReviewTasks
      security:
        - sessionCookie: []
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [reviewer, requested], default: reviewer }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, cancelled, all], default: pending }
        - name: types
          in: query
          description: Optional comma-separated resource-type filter.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 5
            items:
              type: string
              enum: [docker_image, npm_package, cargo_package, maven_artifact, maven_domain]
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Bounded review page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewTaskPage" }
        "400": { description: Invalid view, status, type, or page boundary. }
        "401": { description: A browser session is required. }

  /api/reviews/super-team-transfers:
    post:
      tags: [reviews]
      summary: Request a global-team ownership transfer
      description: >
        The caller must own the project or domain at L4, or hold current repository/system administration authority.
        Transfer-in also requires membership in the target team.
        A T3 or T4 manager of the reviewing team or a system administrator must decide the request. Direct team-to-team transfers,
        mirrored resources, and returns of namespaced Docker or scoped npm resources to personal ownership are rejected.
      operationId: createSuperTeamTransferReview
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuperTeamTransferReviewRequest" }
      responses:
        "201":
          description: Pending review created.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewTask" }
        "400": { description: Invalid resource identity or namespace/team mismatch. }
        "403": { description: The caller does not own or administer the resource, or is not a member of the target team. }
        "409": { description: This resource already has a pending transfer, ownership changed, or transfer-out is restricted. }

  /api/reviews/{id}/decision:
    post:
      tags: [reviews]
      summary: Decide one pending review
      description: >
        A T3 or T4 manager of the reviewing team or a system administrator may approve or reject. A requester who has
        reviewer authority may decide their own task.
        Rejection requires a reason. A pending-state compare-and-set guarantees that only one decision is applied.
      operationId: decideReviewTask
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                reason:
                  type: string
                  maxLength: 512
                  description: Required and non-empty when `decision` is `rejected`; ignored for approval.
      responses:
        "200":
          description: Review decided and approved ownership applied atomically when requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewTask" }
        "400": { description: Invalid decision or missing rejection reason. }
        "403": { description: The caller is not an eligible independent reviewer. }
        "404": { description: Review task not found. }
        "409": { description: Another manager decided the task or the resource changed. }

  /api/reviews/{id}:
    delete:
      tags: [reviews]
      summary: Cancel a pending review request
      description: Only the original requester may cancel a task, and only while it remains pending.
      operationId: cancelReviewTask
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Cancelled review record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewTask" }
        "403": { description: The caller did not request this task. }
        "404": { description: Review task not found. }
        "409": { description: The task is no longer pending. }

  # ========== Maven domain registry ==========
  /api/maven/domains:
    get:
      tags: [maven]
      summary: List Maven publishing domains
      description: Lists global verified domains plus pending domains visible to the current user.
      operationId: listMavenDomains
      responses:
        "200":
          description: Domain catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains:
                    type: array
                    items:
                      $ref: "#/components/schemas/MavenDomain"
    post:
      tags: [maven]
      summary: Reserve a Maven publishing domain
      description: |
        Creates one global pending domain owned by the caller. Its team and verification apply to every Maven repository.
      operationId: createMavenDomain
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  example: com.example
                super_team_prefix:
                  type: string
                  maxLength: 64
                  description: Optional T3/T4 global-team binding for this publishing domain.
      responses:
        "201":
          description: Domain created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MavenDomain"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "403":
          description: The caller lacks T3/T4 membership in the selected global team.
        "409":
          description: Domain already exists in this RenoP instance.

  /api/maven/domains/{domain}:
    get:
      tags: [maven]
      summary: Get a Maven domain and team
      operationId: getMavenDomain
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Domain details. Verification code and team are hidden from unauthorized viewers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MavenDomainDetails"
        "404":
          $ref: "#/components/responses/PlainNotFound"
    delete:
      tags: [maven]
      summary: Delete an empty Maven domain
      operationId: deleteMavenDomain
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Domain deleted.
        "409":
          description: Domain still contains artifacts or cannot lose its owner.

  /api/maven/domains/{domain}/verify:
    post:
      tags: [maven]
      summary: Verify Maven domain ownership
      description: Checks all TXT values at the registered DNS root, a GitHub Bio/organization Description, or a GitLab Bio/group Description. Attempts are limited to once every five seconds per domain.
      operationId: verifyMavenDomain
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verified domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MavenDomain"
        "409":
          description: Ownership proof was not found.
        "429":
          description: Verification was retried within five seconds.

  /api/maven/domains/{domain}/verify/force:
    post:
      tags: [maven]
      summary: Force a Maven domain to verified status
      description: System-administrator override. External proof is not checked and the action is audited.
      operationId: forceVerifyMavenDomain
      security:
        - sessionCookie: []
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verified domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MavenDomain"
        "403":
          $ref: "#/components/responses/PlainForbidden"

  /api/maven/domains/{domain}/members:
    get:
      tags: [maven]
      summary: List Maven domain members
      operationId: listMavenDomainMembers
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Domain members.
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/MavenMember"
    post:
      tags: [maven]
      summary: Invite Maven domain members
      description: Invites between one and twenty accounts in one atomic request. Administrators add accounts immediately.
      operationId: inviteMavenDomainMembers
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users, level]
              properties:
                users:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                level:
                  type: integer
                  minimum: 0
                  maximum: 4
      responses:
        "201":
          description: Invitations created.

  /api/maven/domains/{domain}/members/{username}:
    put:
      tags: [maven]
      summary: Change a Maven domain member level
      operationId: updateMavenDomainMember
      security:
        - sessionCookie: []
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  type: integer
                  minimum: 0
                  maximum: 4
      responses:
        "200":
          description: Member updated.
    delete:
      tags: [maven]
      summary: Remove or leave a Maven domain team
      operationId: deleteMavenDomainMember
      security:
        - sessionCookie: []
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member removed.
        "409":
          description: The operation would remove the last L4 owner.

  /api/maven/invitations/{id}/{decision}:
    post:
      tags: [maven]
      summary: Respond to a Maven domain invitation
      operationId: respondMavenDomainInvitation
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: decision
          in: path
          required: true
          schema:
            type: string
            enum: [accept, reject]
      responses:
        "200":
          description: Invitation action completed.

  /api/maven/repositories/{repo_name}/domains:
    get:
      tags: [maven]
      summary: List Maven domains in a repository
      description: Lists verified global domains that currently contain cataloged artifacts in this repository. Domain teams and verification remain global.
      operationId: listMavenRepositoryDomains
      parameters:
        - $ref: "#/components/parameters/RepoName"
      responses:
        "200":
          description: Repository-local domain catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  repository:
                    type: string
                  domains:
                    type: array
                    items:
                      $ref: "#/components/schemas/MavenDomain"

  /api/maven/repositories/{repo_name}/packages:
    get:
      tags: [maven]
      summary: Search the Maven artifact catalog
      operationId: listMavenArtifacts
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - name: domain
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Artifact catalog page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  repository:
                    type: string
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/MavenArtifact"
                  total:
                    type: integer

  /api/maven/repositories/{repo_name}/package:
    get:
      tags: [maven]
      summary: Get Maven artifact details
      operationId: getMavenArtifact
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - name: group
          in: query
          required: true
          schema:
            type: string
        - name: artifact
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact, versions, bounded indexed-file summaries, and latest-POM project metadata when available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MavenArtifactDetails"
    put:
      tags: [maven]
      summary: Update a Maven artifact description or README
      operationId: updateMavenArtifact
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - name: group
          in: query
          required: true
          schema:
            type: string
        - name: artifact
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [description]
                - required: [readme]
              properties:
                description:
                  type: string
                  maxLength: 4000
                readme:
                  type: string
                  maxLength: 524288
      responses:
        "200":
          description: Artifact updated.

  /api/maven/repositories/{repo_name}/versions:
    delete:
      tags: [maven]
      summary: Delete one Maven artifact version
      operationId: deleteMavenArtifactVersion
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - name: group
          in: query
          required: true
          schema:
            type: string
        - name: artifact
          in: query
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Version and generated metadata removed.

  # ========== Maven helpers ==========
  /api/maven/details:
    get:
      tags: [maven]
      summary: Virtual root — list visible repositories
      operationId: getMavenDetailsRoot
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Root directory listing.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/FileDetails"

  /api/maven/details/{repo_name}:
    get:
      tags: [maven]
      summary: Repository root details
      operationId: getMavenDetailsRepo
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
      responses:
        "200":
          description: Repository root details.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/FileDetails"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /api/maven/details/{repo_name}/{path}:
    get:
      tags: [maven]
      summary: Path details under a repository
      description: |
        Returns a `FileDetails` node for a file or directory. Server route: `/api/maven/details/:repo_name/*`.
      operationId: getMavenDetailsPath
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - $ref: "#/components/parameters/MavenPath"
      responses:
        "200":
          description: File or directory details.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/FileDetails"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /api/maven/repo-details/{repo_name}:
    get:
      tags: [maven]
      summary: Repository statistics and mirror summary
      operationId: getMavenRepoDetails
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
      responses:
        "200":
          description: Repository details.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/RepoDetailsResponse"
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /api/maven/versions/{repo_name}/{path}:
    get:
      tags: [maven]
      summary: List versions for a Maven coordinate
      description: |
        Returns all known versions for the Maven `groupId/artifactId` path.
        Server route: `/api/maven/versions/:repo_name/*`.
      operationId: getMavenVersions
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - $ref: "#/components/parameters/MavenPath"
        - $ref: "#/components/parameters/VersionFilter"
        - $ref: "#/components/parameters/VersionSorted"
      responses:
        "200":
          description: Version list.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/VersionsResponse"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /api/maven/latest/version/{repo_name}/{path}:
    get:
      tags: [maven]
      summary: Latest version string
      description: |
        Returns the latest version. Pass `?type=raw` for a plain-text response.
        Server route: `/api/maven/latest/version/:repo_name/*`.
      operationId: getMavenLatestVersion
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - $ref: "#/components/parameters/MavenPath"
        - $ref: "#/components/parameters/VersionFilter"
        - $ref: "#/components/parameters/VersionSorted"
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [raw]
          description: When `raw`, response is a plain-text version string.
      responses:
        "200":
          description: Latest version.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/LatestVersionResponse"
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /api/maven/latest/details/{repo_name}/{path}:
    get:
      tags: [maven]
      summary: FileDetails for the latest matching artifact
      description: Server route `/api/maven/latest/details/:repo_name/*`.
      operationId: getMavenLatestDetails
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - $ref: "#/components/parameters/MavenPath"
        - name: extension
          in: query
          schema:
            type: string
            default: jar
        - name: classifier
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/VersionFilter"
      responses:
        "200":
          description: File details for the latest artifact.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/FileDetails"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /api/maven/latest/file/{repo_name}/{path}:
    get:
      tags: [maven]
      summary: Download the latest matching artifact
      description: Streams or redirects the artifact at the latest version. Server route `/api/maven/latest/file/:repo_name/*`.
      operationId: getMavenLatestFile
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - $ref: "#/components/parameters/MavenPath"
        - name: extension
          in: query
          schema:
            type: string
            default: jar
        - name: classifier
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/VersionFilter"
      responses:
        "200":
          description: Artifact file body.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: Redirect (issued when S3 `redirect_downloads` is enabled).
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /api/badge/latest/{repo_name}/{path}:
    get:
      tags: [maven]
      summary: Latest-version SVG badge
      description: Returns a Shields.io-compatible SVG badge. Server route `/api/badge/latest/:repo_name/*`.
      operationId: getBadgeLatest
      security: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - $ref: "#/components/parameters/MavenPath"
        - name: name
          in: query
          schema:
            type: string
          description: Left-side label text (defaults to the repository name).
        - name: color
          in: query
          schema:
            type: string
          description: Right-side background color (alphanumeric or `#RRGGBB`).
        - name: prefix
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/VersionFilter"
      responses:
        "200":
          description: SVG badge image.
          content:
            image/svg+xml:
              schema:
                type: string

  /api/maven/generate/pom/{repo_name}/{path}:
    post:
      tags: [maven]
      summary: Generate and write a POM file
      description: |
        Generates a minimal POM and writes it to storage. Requires write permission.
        Server route: `/api/maven/generate/pom/:repo_name/*`.
      operationId: postMavenGeneratePom
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - $ref: "#/components/parameters/MavenPath"
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              $ref: "#/components/schemas/PomDetails"
          application/json:
            schema:
              $ref: "#/components/schemas/PomDetails"
      responses:
        "200":
          description: POM generated and stored.
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "507":
          description: Insufficient disk space.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/privacy-policy:
    get:
      tags: [maven]
      summary: Privacy policy
      description: Returns the contents of `privacy-policy.txt` from the working directory, if present.
      operationId: getPrivacyPolicy
      security: []
      responses:
        "200":
          description: Privacy policy text.
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: File not present.
    head:
      tags: [maven]
      summary: Privacy policy existence check
      operationId: headPrivacyPolicy
      security: []
      responses:
        "200":
          description: File present.
        "404":
          description: File not present.

  # ========== Settings ==========
  /api/settings/index/rebuild:
    post:
      tags: [settings]
      summary: Rebuild artifact index
      description: |
        Triggers a Maven artifact index rebuild. Requires the `manager` permission.
        `full` re-indexes every file; `diff` indexes only new files.
      operationId: postSettingsIndexRebuild
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              $ref: "#/components/schemas/RebuildIndexRequest"
      responses:
        "200":
          description: Rebuild initiated (empty body).
          content:
            text/plain:
              schema:
                type: string
                example: ""
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "403":
          $ref: "#/components/responses/PlainForbidden"

  /api/settings/domains:
    get:
      tags: [settings]
      summary: List configuration domain names
      operationId: getSettingsDomains
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Domain name list.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/SettingsDomainsResponse"
        "403":
          $ref: "#/components/responses/PlainForbidden"

  /api/settings/domain/{name}:
    get:
      tags: [settings]
      summary: Get one configuration domain
      description: |
        Returns the current configuration for the named domain as protobuf.
        Domain-to-type mapping:
        `frontend` → `FrontendConfig`, `server` → `ServerConfig`, `proxy` → `ProxyConfig`,
        `storage` → `StorageConfig`, `updater` → `UpdaterConfig`, `index` → `IndexDomainSettings`.
        Requires the `manager` permission.
      operationId: getSettingsDomain
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DomainName"
      responses:
        "200":
          description: Domain configuration (protobuf body, shape depends on domain name).
          content:
            application/x-protobuf:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FrontendConfig"
                  - $ref: "#/components/schemas/ServerConfig"
                  - $ref: "#/components/schemas/ProxyConfig"
                  - $ref: "#/components/schemas/StorageConfig"
                  - $ref: "#/components/schemas/UpdaterConfig"
                  - $ref: "#/components/schemas/IndexDomainSettings"
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "404":
          $ref: "#/components/responses/PlainNotFound"
    put:
      tags: [settings]
      summary: Replace one configuration domain
      description: |
        Full replacement of the domain. Omitted proto3 fields revert to zero values.
        Send the complete desired configuration. Requires the `manager` permission.
      operationId: putSettingsDomain
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DomainName"
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              oneOf:
                - $ref: "#/components/schemas/FrontendConfig"
                - $ref: "#/components/schemas/ServerConfig"
                - $ref: "#/components/schemas/ProxyConfig"
                - $ref: "#/components/schemas/StorageConfig"
                - $ref: "#/components/schemas/UpdaterConfig"
      responses:
        "200":
          description: Configuration saved (empty body).
          content:
            text/plain:
              schema:
                type: string
                example: ""
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /api/settings/maven/repositories:
    get:
      tags: [settings]
      summary: List Maven repository configurations
      operationId: getSettingsMavenRepositories
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Repository configuration map.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/MavenRepositoriesResponse"
        "403":
          $ref: "#/components/responses/PlainForbidden"

  /api/settings/maven/repositories/{name}:
    put:
      tags: [settings]
      summary: Create or replace a repository
      description: |
        Full replacement of the repository config. Path `:name` overrides body `name`.
        Reserved names: `css`, `js`, `svg`, `api`, `javadocs`, `assets`, `cargodoc`, `v2`.
        Requires the `manager` permission.
      operationId: putSettingsMavenRepository
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              $ref: "#/components/schemas/Repository"
      responses:
        "200":
          description: Repository saved (empty body).
          content:
            text/plain:
              schema:
                type: string
                example: ""
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "403":
          $ref: "#/components/responses/PlainForbidden"
    delete:
      tags: [settings]
      summary: Remove a repository from configuration
      description: Removes the repository from config. Does not delete files on disk or in S3. Requires the `manager` permission.
      operationId: deleteSettingsMavenRepository
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Repository removed (empty body).
          content:
            text/plain:
              schema:
                type: string
                example: ""
        "403":
          $ref: "#/components/responses/PlainForbidden"

  /api/settings/repositories/download-statistics:
    get:
      tags: [settings, statistics]
      summary: Read download-statistics switches
      operationId: getRepositoryDownloadStatisticsSettings
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Effective enable state keyed by repository name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  repositories:
                    type: object
                    additionalProperties:
                      type: boolean

  /api/settings/repositories/{name}/download-statistics:
    put:
      tags: [settings, statistics]
      summary: Enable or disable repository download statistics
      operationId: putRepositoryDownloadStatisticsSettings
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Effective repository state.
    delete:
      tags: [settings, statistics]
      summary: Reset repository download statistics
      operationId: resetRepositoryDownloadStatistics
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Persisted and pending counters were cleared.

  /api/statistics:
    get:
      tags: [statistics]
      summary: Query the API-token owner's download statistics
      description: Requires a Bearer API token with `statistics:read`; browser sessions and Basic credentials are rejected.
      operationId: getOwnDownloadStatistics
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StatisticsGroupBy"
        - $ref: "#/components/parameters/StatisticsRepository"
        - $ref: "#/components/parameters/StatisticsFormat"
        - $ref: "#/components/parameters/StatisticsNamespace"
        - $ref: "#/components/parameters/StatisticsPackage"
        - $ref: "#/components/parameters/StatisticsVersion"
        - $ref: "#/components/parameters/StatisticsLimit"
        - $ref: "#/components/parameters/StatisticsOffset"
      responses:
        "200":
          description: Statistics grouped at the requested level.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadStatisticsPage"

  /api/statistics/users/{username}:
    get:
      tags: [statistics]
      summary: Query one user's download statistics
      description: The token owner may query itself. Another account requires a system administrator token with `admin:statistics`.
      operationId: getUserDownloadStatistics
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/StatisticsGroupBy"
        - $ref: "#/components/parameters/StatisticsRepository"
        - $ref: "#/components/parameters/StatisticsFormat"
        - $ref: "#/components/parameters/StatisticsNamespace"
        - $ref: "#/components/parameters/StatisticsPackage"
        - $ref: "#/components/parameters/StatisticsVersion"
        - $ref: "#/components/parameters/StatisticsLimit"
        - $ref: "#/components/parameters/StatisticsOffset"
      responses:
        "200":
          description: User-bound statistics page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadStatisticsPage"

  /api/statistics/system:
    get:
      tags: [statistics]
      summary: Query system-wide download statistics
      description: Requires a system administrator Bearer API token with `admin:statistics`.
      operationId: getSystemDownloadStatistics
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/StatisticsGroupBy"
        - $ref: "#/components/parameters/StatisticsRepository"
        - $ref: "#/components/parameters/StatisticsFormat"
        - $ref: "#/components/parameters/StatisticsNamespace"
        - $ref: "#/components/parameters/StatisticsPackage"
        - $ref: "#/components/parameters/StatisticsVersion"
        - $ref: "#/components/parameters/StatisticsLimit"
        - $ref: "#/components/parameters/StatisticsOffset"
      responses:
        "200":
          description: System-wide statistics page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadStatisticsPage"

  # ========== Updater ==========
  /api/updater/status:
    get:
      tags: [updater]
      summary: Current update state
      operationId: getUpdaterStatus
      security: []
      responses:
        "200":
          description: Update state.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/UpdateState"

  /api/updater/check:
    post:
      tags: [updater]
      summary: Check for available updates
      operationId: postUpdaterCheck
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Channel"
      responses:
        "200":
          description: Update check result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "403":
          $ref: "#/components/responses/UpdaterJsonError"
        "500":
          $ref: "#/components/responses/UpdaterJsonError"

  /api/updater/install:
    post:
      tags: [updater]
      summary: Download and install an online update (async)
      description: Initiates asynchronous download. Monitor via `GET /api/updater/status`. Requires the `manager` permission.
      operationId: postUpdaterInstall
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Download initiated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallStarted"
        "403":
          $ref: "#/components/responses/UpdaterJsonError"
        "409":
          $ref: "#/components/responses/UpdaterJsonError"
        "507":
          $ref: "#/components/responses/UpdaterJsonError"

  /api/updater/upload:
    post:
      tags: [updater]
      summary: Install an offline update package
      description: Accepts a raw `.br` or legacy `.zip` update package via multipart upload (field `file` or `package`). Requires the `manager` permission.
      operationId: postUpdaterUpload
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                package:
                  type: string
                  format: binary
      responses:
        "200":
          description: Package installed; ready to restart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineInstallResult"
        "400":
          $ref: "#/components/responses/UpdaterJsonError"
        "403":
          $ref: "#/components/responses/UpdaterJsonError"
        "409":
          $ref: "#/components/responses/UpdaterJsonError"
        "413":
          $ref: "#/components/responses/UpdaterJsonError"
        "507":
          $ref: "#/components/responses/UpdaterJsonError"

  /api/updater/restart:
    post:
      tags: [updater]
      summary: Apply pending update and restart
      description: |
        Applies a pending update binary (if any) and restarts the process. Connection will drop.
        Requires the `manager` permission.
      operationId: postUpdaterRestart
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Restart initiated (connection will drop).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restarting"
        "403":
          $ref: "#/components/responses/UpdaterJsonError"
        "500":
          $ref: "#/components/responses/UpdaterJsonError"

  # ========== Chunked Upload ==========
  /api/upload/chunked/:
    post:
      tags: [storage, updater]
      summary: Initiate a multi-part upload session
      description: |
        Creates a chunked upload session. Upload parts via `PUT /api/upload/chunked/{id}/{index}`,
        then commit with `POST /api/upload/chunked/{id}/complete`. Failed parts may be retried safely.
      operationId: postChunkedUploadInit
      security:
        - sessionCookie: []
        - basicAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              $ref: "#/components/schemas/ChunkedUploadInitRequest"
      responses:
        "200":
          description: Session created.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/ChunkedUploadInitResponse"
        "400":
          $ref: "#/components/responses/JsonError"
        "403":
          $ref: "#/components/responses/JsonError"
        "409":
          $ref: "#/components/responses/JsonError"
        "507":
          $ref: "#/components/responses/JsonError"

  /api/upload/chunked/{upload_id}/{index}:
    put:
      tags: [storage, updater]
      summary: Upload one chunk
      description: Uploads a raw part. Parts may be uploaded concurrently. Re-uploading an accepted index is a no-op.
      operationId: putChunkedUploadPart
      security:
        - sessionCookie: []
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: Zero-based part index.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Part accepted.
        "400":
          $ref: "#/components/responses/JsonError"
        "404":
          $ref: "#/components/responses/JsonError"

  /api/upload/chunked/{upload_id}/complete:
    post:
      tags: [storage, updater]
      summary: Complete a multi-part upload
      description: Assembles all parts and commits the artifact or offline update package.
      operationId: postChunkedUploadComplete
      security:
        - sessionCookie: []
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updater package installed (`purpose=updater`).
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/ChunkedUploadCompleteResponse"
        "201":
          description: Artifact stored (`purpose=storage`).
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/ChunkedUploadCompleteResponse"
        "400":
          $ref: "#/components/responses/JsonError"
        "409":
          $ref: "#/components/responses/JsonError"
        "507":
          $ref: "#/components/responses/JsonError"

  /api/upload/chunked/{upload_id}:
    delete:
      tags: [storage, updater]
      summary: Abort a multi-part upload
      operationId: deleteChunkedUpload
      security:
        - sessionCookie: []
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session discarded.

  # ========== Messages ==========
  /api/messages:
    get:
      tags: [messages]
      summary: List inbox messages (paginated)
      description: |
        Returns the authenticated user's inbox in reverse-chronological order.
        Use `?cursor=<next_cursor>` from the previous response to fetch the next page.
        Never cached (`Cache-Control: no-store`).
      operationId: getMessages
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque base64url pagination cursor from the previous page's `next_cursor`.
      responses:
        "200":
          description: Paginated message list.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"
    delete:
      tags: [messages]
      summary: Clear all messages
      description: Deletes all inbox messages for the authenticated user. Messages with a `pending` action are not deleted.
      operationId: clearMessages
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Messages cleared.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/ClearMessagesResponse"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/messages/unread-count:
    get:
      tags: [messages]
      summary: Unread message count
      operationId: getMessagesUnreadCount
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Unread count.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/UnreadCountResponse"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/messages/read-all:
    post:
      tags: [messages]
      summary: Mark all messages as read
      operationId: postMessagesReadAll
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: All messages marked read.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/MarkAllReadResponse"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

  /api/messages/{id}/read:
    post:
      tags: [messages]
      summary: Mark one message as read
      operationId: postMessageRead
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Message marked read.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  /api/messages/{id}:
    delete:
      tags: [messages]
      summary: Delete one message
      description: |
        Deletes a single inbox message. Returns 404 if the message does not belong to the user.
        Returns 409 if the message has a `pending` action that must be resolved first.
      operationId: deleteMessage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Message deleted.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"
        "404":
          $ref: "#/components/responses/PlainNotFound"
        "409":
          $ref: "#/components/responses/PlainConflict"

  /api/messages/admin/users:
    get:
      tags: [messages]
      summary: Search accounts for notification targeting (manager)
      description: Returns up to 8 account names matching `?q=`. Requires the `manager` permission.
      operationId: getMessagesAdminUsers
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching account names.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/UserSearchResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "403":
          $ref: "#/components/responses/PlainForbidden"

  /api/messages/admin:
    post:
      tags: [messages]
      summary: Send broadcast notification (manager)
      description: >-
        Sends an `announcement` to one or more accounts, or all accounts when `all: true`.
        Requires the `manager` permission.
      operationId: postMessagesAdmin
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              $ref: "#/components/schemas/SendNotificationRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationRequest"
      responses:
        "201":
          description: Notification delivered.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/SendNotificationResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "403":
          $ref: "#/components/responses/PlainForbidden"

  # ========== Audit ==========
  /api/profile/audit-logs:
    get:
      tags: [audit]
      summary: Own audit log
      description: |
        Returns the authenticated user's audit log, paginated. The `operator` field is masked to
        `"Administrator"` for entries where a manager acted on the user's behalf.
      operationId: getSelfAuditLogs
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Paginated audit log.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"
    delete:
      tags: [audit]
      summary: Clear own audit log (not permitted)
      description: Always returns `403`. Users cannot delete their own audit log entries.
      operationId: deleteSelfAuditLogs
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "403":
          $ref: "#/components/responses/PlainForbidden"

  /api/users/{username}/audit-logs:
    get:
      tags: [audit]
      summary: Get audit log for a user (manager)
      description: Returns the full audit log for the named account. Requires the `manager` permission.
      operationId: getUserAuditLogs
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Paginated audit log.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "403":
          $ref: "#/components/responses/PlainForbidden"
    delete:
      tags: [audit]
      summary: Clear audit log for a user (manager)
      description: Permanently deletes all audit log entries for the account and records a `LOG_CLEAR` event. Requires the `manager` permission.
      operationId: deleteUserAuditLogs
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit log cleared.
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "403":
          $ref: "#/components/responses/PlainForbidden"

  # ========== Storage (Maven layout) ==========
  /{repo_name}/{path}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/MavenPath"
    get:
      tags: [storage]
      summary: Download artifact or browse path
      description: |
        Serves a Maven artifact or directory listing. Supports conditional requests (`If-None-Match`,
        `If-Modified-Since`). Anonymous GET is permitted on PUBLIC and HIDDEN repositories.
        Server route: `/:repo_name/*`.
      operationId: getStoragePath
      security:
        - {}
        - basicAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Artifact body.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
                description: Management SPA fallback for browser requests.
        "304":
          description: Not modified.
        "401":
          $ref: "#/components/responses/PlainUnauthorized"
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "404":
          $ref: "#/components/responses/PlainNotFound"
    head:
      tags: [storage]
      summary: Artifact metadata
      description: Returns headers only (Content-Length, Content-Type, Last-Modified, ETag) without a body.
      operationId: headStoragePath
      security:
        - {}
        - basicAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Headers only.
        "404":
          $ref: "#/components/responses/PlainNotFound"
    put:
      tags: [storage]
      summary: Upload or overwrite artifact
      description: Requires write (`canupdate`) permission. Returns `507` when disk space is insufficient.
      operationId: putStoragePath
      security:
        - basicAuth: []
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Artifact stored.
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "507":
          description: Insufficient disk space.
    post:
      tags: [storage]
      summary: Upload or overwrite artifact (POST)
      description: Identical to the PUT variant. Provided for compatibility with tools that prefer POST.
      operationId: postStoragePath
      security:
        - basicAuth: []
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Artifact stored.
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "403":
          $ref: "#/components/responses/PlainForbidden"
    delete:
      tags: [storage]
      summary: Delete artifact or path
      description: Requires write (`canupdate`) permission.
      operationId: deleteStoragePath
      security:
        - basicAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  # ========== Javadoc ==========
  /javadoc/{repo_name}/{path}:
    get:
      tags: [javadoc]
      summary: Javadoc jar preview
      description: |
        Serves files extracted from a Javadoc jar. Append `/raw/...` to retrieve jar-internal resources.
        Requires read permission. Extraction is size-limited by `storage.max_javadoc_size_mb`.
        Server route: `/javadoc/:repo_name/*`.
      operationId: getJavadoc
      security:
        - {}
        - bearerAuth: []
