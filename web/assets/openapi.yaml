openapi: 3.0.3
info:
  title: RenoP HTTP API
  version: "1.0"
  description: |
    Management and helper APIs for RenoP, a self-hosted Maven repository server.

    Default listen address: `0.0.0.0:3000`.

    - Management routes live under `/api`.
    - Artifact storage uses Maven layout at `/{repo}/{path}` (not under `/api`).

    Some endpoints use `application/x-protobuf` (see `proto/api/v1/api.proto`).
    Those are marked with content type `application/x-protobuf`; schemas below
    describe the logical fields (snake_case) for documentation and client stubs.
    Wire format is protobuf, not JSON.

    Error bodies are often plain text (`Unauthorized`, `Forbidden`, `Not found`).
    Prefer status codes over body shape.

  license:
    name: MPL-2.0
    url: https://mozilla.org/MPL/2.0/

servers:
  - url: http://localhost:3000
    description: Local default

tags:
  - name: auth
    description: Login, session, profile
  - name: tokens
    description: Account management (manager)
  - name: maven
    description: Browse, versions, badge, POM helpers
  - name: status
    description: Health and runtime metrics
  - name: settings
    description: Config domains, repositories, index rebuild
  - name: updater
    description: Online and offline updates
  - name: storage
    description: Maven repository file paths
  - name: javadoc
    description: Javadoc jar preview

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: renop_session
      description: HttpOnly session cookie set by POST /api/auth/login.
    sessionHeader:
      type: apiKey
      in: header
      name: Authorization
      description: |
        `Session <session-id>` — same id as the cookie value.
    basicAuth:
      type: http
      scheme: basic
      description: |
        Username + password, or username + upload token.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Either `name:secret` or a bare upload token (looked up by token index).
        May also pass `?token=` on GET/HEAD only.

  parameters:
    RepoName:
      name: repo_name
      in: path
      required: true
      schema:
        type: string
      description: Maven repository name (e.g. releases, snapshots, private).
    MavenPath:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: |
        Maven layout path under the repository (group/artifact/…).
        In the real server this is a Fiber catch-all `*`.
    TokenName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Account name (case-insensitive; stored lowercased).
    SessionPublicId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
      description: Session public_id (not the raw session cookie value).
    DomainName:
      name: name
      in: path
      required: true
      schema:
        type: string
        enum: [ frontend, server, storage, updater, index ]
    VersionFilter:
      name: filter
      in: query
      required: false
      schema:
        type: string
      description: Version substring filter.
    VersionSorted:
      name: sorted
      in: query
      required: false
      schema:
        type: boolean
        default: true
    Channel:
      name: channel
      in: query
      required: false
      schema:
        type: string
        enum: [ release, nightly ]
        default: release

  responses:
    PlainUnauthorized:
      description: Not authenticated or invalid credentials.
      content:
        text/plain:
          schema:
            type: string
            example: Unauthorized
    PlainForbidden:
      description: Authenticated but not allowed, or account expired.
      content:
        text/plain:
          schema:
            type: string
            example: Forbidden
    PlainNotFound:
      description: Resource not found (also used for some permission denials).
      content:
        text/plain:
          schema:
            type: string
            example: Not found
    PlainBadRequest:
      description: Invalid parameters or body.
      content:
        text/plain:
          schema:
            type: string
            example: Bad Request
    PlainConflict:
      description: Conflict (name exists, install already running, …).
      content:
        text/plain:
          schema:
            type: string
    JsonError:
      description: Error object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: string

    StatusOk:
      type: object
      description:
        Protobuf message StatusOk (application/x-protobuf) for some mutating auth/session endpoints; also used as JSON `{status: success}` elsewhere.
      properties:
        status:
          type: string
          example: success

    # --- Auth / tokens ---
    LoginRequest:
      type: object
      description: Protobuf message LoginRequest (wire format application/x-protobuf).
      required: [ name, secret ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        secret:
          type: string
          minLength: 1
          maxLength: 72

    AccessTokenIdentifier:
      type: object
      properties:
        type:
          type: string
          example: PERSISTENT
        value:
          type: integer
          format: int32

    AccessTokenDto:
      type: object
      properties:
        identifier:
          $ref: "#/components/schemas/AccessTokenIdentifier"
        name:
          type: string
        created_at:
          type: string
          format: date-time
        description:
          type: string
        expires_at:
          type: integer
          format: int64
          nullable: true
          description: Unix milliseconds; null if none.
        tokens:
          type: array
          items:
            type: string
          description: Upload tokens (plaintext when present).
        permissions:
          type: array
          items:
            type: string
          example: [ "manager", "canview:*", "canupdate:*" ]

    AccessTokenPermission:
      type: object
      properties:
        identifier:
          type: string
        shortcut:
          type: string

    RoutePermission:
      type: object
      properties:
        identifier:
          type: string
          example: route:read
        shortcut:
          type: string
          example: r

    Route:
      type: object
      properties:
        path:
          type: string
        permission:
          $ref: "#/components/schemas/RoutePermission"

    SessionDetails:
      type: object
      description: Protobuf message SessionDetails.
      properties:
        access_token:
          $ref: "#/components/schemas/AccessTokenDto"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/AccessTokenPermission"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        session_token:
          type: string
          description: |
            Set when the request used an Authorization Session header.
            Empty on login (session id is only in the renop_session cookie).

    AccessTokenList:
      type: object
      description: Protobuf message AccessTokenList.
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/AccessTokenDto"

    UpdatePasswordRequest:
      type: object
      description: Protobuf message UpdatePasswordRequest (application/x-protobuf).
      required: [ new_password ]
      properties:
        new_password:
          type: string
          minLength: 6
          maxLength: 72

    GenerateTokenResponse:
      type: object
      description: Protobuf message GenerateTokenResponse (application/x-protobuf).
      properties:
        token:
          type: string
          format: uuid

    UploadTokenResponse:
      type: object
      description: Legacy upload token response alias (see GenerateTokenResponse).
      properties:
        token:
          type: string
          format: uuid

    FidoDeviceDto:
      type: object
      description: Protobuf message FidoDeviceDto (application/x-protobuf).
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        created_at:
          type: integer
          format: int64

    FidoDeviceList:
      type: object
      description: Protobuf message FidoDeviceList (application/x-protobuf).
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/FidoDeviceDto"

    SessionDto:
      type: object
      description: |
        Protobuf message SessionDto (application/x-protobuf). Browser login session only;
        Basic/Bearer credentials are not listed. The session secret is never returned.
      properties:
        public_id:
          type: string
          description: Opaque public id used for revoke APIs (not the cookie secret).
        username:
          type: string
        ip:
          type: string
          description: Last seen client IP for this session.
        user_agent:
          type: string
          description: User-Agent / device string captured at login (and kept on the session).
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds
        last_active:
          type: integer
          format: int64
          description: Unix milliseconds — last activity (idle timeout base)
        expires_at:
          type: integer
          format: int64
          description: Unix milliseconds — last_active + idle timeout (typically 7 days)
        current:
          type: boolean
          description: True when this session is the one making the request.

    SessionList:
      type: object
      description: Protobuf message SessionList (application/x-protobuf).
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionDto"

    CreateAccessTokenRequest:
      type: object
      description: Protobuf message CreateAccessTokenRequest (application/x-protobuf).
      properties:
        permissions:
          type: array
          items:
            type: string
        secret:
          type: string
          nullable: true
          description: Omit on create to generate a UUID password; omit on update to keep current password.
        new_name:
          type: string
          nullable: true
        is_create:
          type: boolean
          description: If true and name exists, returns 409.

    CreateAccessTokenResponse:
      type: object
      description: Protobuf message CreateAccessTokenResponse (application/x-protobuf).
      properties:
        access_token:
          $ref: "#/components/schemas/AccessTokenDto"
        secret:
          type: string
          description: Only set when generated or supplied on this request.

    # --- Maven ---
    FileDetails:
      type: object
      description: Protobuf message FileDetails (also returned as JSON from latest/details).
      properties:
        type:
          type: string
          enum: [ FILE, DIRECTORY ]
        name:
          type: string
        content_length:
          type: integer
          format: int64
          nullable: true
        content_type:
          type: string
          nullable: true
        last_modified_time:
          type: string
          nullable: true
          description: RFC3339Nano
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileDetails"

    RepoMirrorInfo:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        persist:
          type: boolean
        enabled_date:
          type: string
        cache_ttl:
          type: integer
          format: int64
        negative_cache:
          type: boolean

    RepoDetailsResponse:
      type: object
      description: Protobuf message RepoDetailsResponse.
      properties:
        name:
          type: string
        visibility:
          type: string
          enum: [ PUBLIC, HIDDEN, PRIVATE ]
        total_size:
          type: integer
          format: int64
        artifact_size:
          type: integer
          format: int64
        metadata_size:
          type: integer
          format: int64
        total_files:
          type: integer
          format: int64
        artifact_count:
          type: integer
          format: int64
        metadata_count:
          type: integer
          format: int64
        mirrors:
          type: array
          items:
            $ref: "#/components/schemas/RepoMirrorInfo"

    VersionsResponse:
      type: object
      description: Protobuf message VersionsResponse (application/x-protobuf).
      properties:
        is_snapshot:
          type: boolean
        versions:
          type: array
          items:
            type: string

    LatestVersionResponse:
      type: object
      description: Protobuf message LatestVersionResponse (application/x-protobuf).
      properties:
        is_snapshot:
          type: boolean
        version:
          type: string

    PomDetails:
      type: object
      description: Protobuf message PomDetails (application/x-protobuf).
      properties:
        group_id:
          type: string
        artifact_id:
          type: string
        version:
          type: string

    # --- Status ---
    UpdateState:
      type: object
      description: Also embedded as protobuf field on InstanceStatus.
      properties:
        status:
          type: string
          enum: [ idle, available, downloading, ready_to_restart, error ]
        latest_version:
          type: string
        download_url:
          type: string
        progress:
          type: integer
        error_message:
          type: string
        size:
          type: integer
          format: int64
        estimated_disk_space:
          type: integer
          format: int64
        release_date:
          type: string
        release_notes:
          type: string
        commit_sha:
          type: string
        is_release:
          type: boolean

    InstanceStatus:
      type: object
      description: Protobuf message InstanceStatus.
      properties:
        version:
          type: string
        development:
          type: boolean
        uptime:
          type: integer
          format: int64
          description: Milliseconds since process start
        used_memory:
          type: integer
          format: int64
          description: Process RSS in bytes (private working set on Windows)
        total_memory:
          type: integer
          format: int64
          description: System physical memory in bytes
        renop_used_disk:
          type: integer
          format: int64
        disk_used:
          type: integer
          format: int64
        disk_total:
          type: integer
          format: int64
        used_threads:
          type: integer
          format: int64
        available_threads:
          type: integer
          format: int64
        total_threads:
          type: integer
          format: int64
        architecture:
          type: string
        os:
          type: string
        logical_cores:
          type: integer
        physical_cores:
          type: integer
        failures_count:
          type: integer
          format: int64
        update_state:
          $ref: "#/components/schemas/UpdateState"
        vss_memory:
          type: integer
          format: int64
          description: Process VSS in bytes (Windows commit charge; Linux/Unix max of RSS, private+swap, Go retained — not full VmSize)
        debug_mode:
          type: boolean
          description: True when this process was started with server.debug_mode (memory dump APIs available)

    StatusSnapshot:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        used_memory:
          type: integer
          format: int64
          description: Process RSS in bytes
        used_threads:
          type: integer
          format: int64
        open_files:
          type: integer
          format: int64
        vss_memory:
          type: integer
          format: int64
          description: Process VSS in bytes

    StatusSnapshotList:
      type: object
      description: Protobuf message StatusSnapshotList.
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/StatusSnapshot"

    RuntimeMemoryBreakdown:
      type: object
      description: >
        Protobuf message RuntimeMemoryBreakdown (application/x-protobuf).
        Debug snapshot of MemStats vs process RSS; not a pprof flame graph.
      properties:
        note: { type: string }
        process_rss: { type: integer, format: int64 }
        process_vss: { type: integer, format: int64 }
        go_retained: { type: integer, format: int64 }
        heap_inuse: { type: integer, format: int64 }
        heap_alloc: { type: integer, format: int64 }
        heap_sys: { type: integer, format: int64 }
        heap_idle: { type: integer, format: int64 }
        heap_released: { type: integer, format: int64 }
        heap_objects: { type: integer, format: int64 }
        stack_inuse: { type: integer, format: int64 }
        stack_sys: { type: integer, format: int64 }
        mspan_inuse: { type: integer, format: int64 }
        mspan_sys: { type: integer, format: int64 }
        mcache_inuse: { type: integer, format: int64 }
        mcache_sys: { type: integer, format: int64 }
        buck_hash_sys: { type: integer, format: int64 }
        gc_sys: { type: integer, format: int64 }
        other_sys: { type: integer, format: int64 }
        sys: { type: integer, format: int64 }
        off_heap_runtime_estimate: { type: integer, format: int64 }
        rss_minus_go_retained: { type: integer, format: int64 }
        num_goroutine: { type: integer, format: int64 }
        num_cpu: { type: integer, format: int32 }

    # --- Settings ---
    RebuildIndexRequest:
      type: object
      description: Protobuf message RebuildIndexRequest (application/x-protobuf).
      required: [ mode ]
      properties:
        mode:
          type: string
          enum: [ full, diff ]

    FrontendConfig:
      type: object
      description: Protobuf message FrontendConfig (application/x-protobuf).
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        organization_website:
          type: string
        organization_logo:
          type: string
        background_url:
          type: string
          description: Must be public WebP, ≤ 5 MiB, when set via PUT.
        icp_license:
          type: string
        legal_notice_url:
          type: string
          description: Optional absolute HTTP(S) URL linked as the legal notice in the footer.

    ServerConfig:
      type: object
      description: Protobuf message ServerConfig (application/x-protobuf).
      properties:
        host:
          type: string
          example: "0.0.0.0"
        port:
          type: integer
          format: int32
          example: 3000
        ssl_enabled:
          type: boolean
        ssl_cert_path:
          type: string
        ssl_key_path:
          type: string
        domains:
          type: array
          items:
            type: string
          description: Public hostnames for this instance (default CORS allowlist).
          example: [ "mvnc.pkg.one", "repo.example.com" ]
        enable_compression:
          type: boolean
        file_cache_size_mb:
          type: integer
          format: int32
        max_active_requests:
          type: integer
          format: int32
        trusted_proxies:
          type: array
          items:
            type: string
        cdn_ip_header:
          type: string
        cors_origins:
          type: array
          items:
            type: string
          description: >
            Extra browser CORS origins on top of domains (domains always remain allowed). Empty = domains only.
            Supports host wildcards (*.pkg.one), full origins, or * for any.
          example: [ "*.pkg.one", "https://partner.example.com" ]
        debug_mode:
          type: boolean
          description: Persist debug mode; restart required to activate dump APIs
        database:
          $ref: "#/components/schemas/DatabaseConfig"

    DatabaseConfig:
      type: object
      description: Protobuf message DatabaseConfig (application/x-protobuf).
      properties:
        enabled:
          type: boolean
        driver:
          type: string
          example: "sqlite3"
        dsn:
          type: string
          example: "renop.db"
        max_open_conns:
          type: integer
          format: int32
        max_idle_conns:
          type: integer
          format: int32
        conn_max_lifetime_sec:
          type: integer
          format: int32

    StorageConfig:
      type: object
      description: Protobuf message StorageConfig (application/x-protobuf).
      properties:
        storage_path:
          type: string
        enable_javadoc_preview:
          type: boolean
        javadoc_extract_path:
          type: string
        max_javadoc_size_mb:
          type: integer
          format: int64
          minimum: 1

    UpdaterConfig:
      type: object
      description: Protobuf message UpdaterConfig (application/x-protobuf).
      properties:
        channel:
          type: string
          enum: [ release, nightly ]
        mode:
          type: string
          enum: [ manual, auto_check, auto_install, safe_install ]

    SettingsDomainsResponse:
      type: object
      description: Protobuf message SettingsDomainsResponse (application/x-protobuf).
      properties:
        domains:
          type: array
          items:
            type: string
          example: [ frontend, server, storage, updater, index ]

    IndexDomainSettings:
      type: object
      description: Empty protobuf message for the index domain (no config fields).

    ChunkedUploadInitRequest:
      type: object
      description: Protobuf message ChunkedUploadInitRequest (wire format application/x-protobuf).
      required: [ size ]
      properties:
        purpose:
          type: string
          enum: [ storage, updater ]
          default: storage
        filename:
          type: string
        size:
          type: integer
          format: int64
        path:
          type: string
          description: Destination for purpose=storage (repo/…/file)
        generate_checksums:
          type: boolean
          default: false
        chunk_size:
          type: integer
          format: int64
          description: Preferred part size in bytes (server may clamp; default 4 MiB)

    ChunkedUploadInitResponse:
      type: object
      description: Protobuf message ChunkedUploadInitResponse (application/x-protobuf).
      properties:
        upload_id:
          type: string
        chunk_size:
          type: integer
          format: int64
        chunk_count:
          type: integer
          format: int32
        purpose:
          type: string

    ChunkedUploadCompleteResponse:
      type: object
      description: Protobuf message ChunkedUploadCompleteResponse (application/x-protobuf).
      properties:
        status:
          type: string
          description: created (storage) or ready_to_restart (updater)
        message:
          type: string
        path:
          type: string
          description: Relative storage path when purpose=storage

    MirrorCredentials:
      type: object
      properties:
        method:
          type: string
          description: e.g. basic, bearer
        login:
          type: string
        password:
          type: string

    Mirror:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        persist:
          type: boolean
        cache_ttl_secs:
          type: integer
          format: int64
        negative_cache:
          type: boolean
        timeout_secs:
          type: integer
          format: int64
        authorization:
          $ref: "#/components/schemas/MirrorCredentials"
        enabled_date:
          type: string
        allow_artifacts:
          type: array
          items:
            type: string
        deny_artifacts:
          type: array
          items:
            type: string

    S3Config:
      type: object
      properties:
        enabled:
          type: boolean
        endpoint:
          type: string
        bucket:
          type: string
        region:
          type: string
        access_key_id:
          type: string
        secret_access_key:
          type: string
        force_path_style:
          type: boolean
        redirect_downloads:
          type: boolean

    Repository:
      type: object
      properties:
        name:
          type: string
        visibility:
          type: string
          enum: [ PUBLIC, HIDDEN, PRIVATE ]
        allow_redeployment:
          type: boolean
        mirrors:
          type: array
          items:
            $ref: "#/components/schemas/Mirror"
        s3:
          $ref: "#/components/schemas/S3Config"

    MavenRepositoriesResponse:
      type: object
      description: Protobuf message MavenRepositoriesResponse.
      properties:
        repositories:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Repository"

    # --- Updater ---
    CheckResult:
      type: object
      properties:
        has_update:
          type: boolean
        current_version:
          type: string
        latest_version:
          type: string
        download_url:
          type: string
        channel:
          type: string
        size:
          type: integer
          format: int64
        estimated_disk_space:
          type: integer
          format: int64
        release_date:
          type: string
        release_notes:
          type: string
        commit_sha:
          type: string
        is_release:
          type: boolean

    InstallStarted:
      type: object
      properties:
        status:
          type: string
          example: started

    OfflineInstallResult:
      type: object
      properties:
        status:
          type: string
          example: ready_to_restart
        message:
          type: string

    Restarting:
      type: object
      properties:
        status:
          type: string
          example: restarting

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  # ========== Auth ==========
  /api/auth/login:
    post:
      tags: [ auth ]
      summary: Login
      operationId: postAuthLogin
      security: [ ]
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: |
            Session created. The session id is delivered only via Set-Cookie
            `renop_session`; SessionDetails.session_token is empty.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: renop_session=…; HttpOnly; SameSite=Lax; Max-Age≈7d
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/SessionDetails"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"
        "403":
          $ref: "#/components/responses/PlainForbidden"

  /api/auth/me:
    get:
      tags: [ auth ]
      summary: Current session user
      operationId: getAuthMe
      security:
        - sessionCookie: [ ]
        - sessionHeader: [ ]
      responses:
        "200":
          description: SessionDetails
          content:
            application/x-protobuf:
              schema:
                $ref: "#/components/schemas/SessionDetails"
        "401":
          $ref: "#/components/responses/PlainUnauthorized"

