        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Documentation deleted.
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargoErrorList"

  /{repo_name}/api/v1/invitations/{owner_login}/{crate_name}:
    post:
      tags: [cargo]
      summary: Respond to a crate ownership invitation
      description: Accepts or declines an ownership invitation. `owner_login` must match the authenticated user.
      operationId: postCargoRespondInvitation
      security:
        - basicAuth: []
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - name: owner_login
          in: path
          required: true
          schema:
            type: string
        - name: crate_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepted]
              properties:
                accepted:
                  type: boolean
      responses:
        "200":
          description: Invitation response recorded.
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Not the invited user or invitation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargoErrorList"

  # ========== Docker image management ==========
  /api/docker/repositories/{repo_name}/images:
    get:
      tags: [docker]
      summary: List visible pre-created container images
      operationId: listDockerImages
      parameters:
        - $ref: "#/components/parameters/RepoName"
      responses:
        "200":
          description: Visible image catalog. Private images without membership are omitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  repository:
                    type: string
                  images:
                    type: array
                    items:
                      $ref: "#/components/schemas/DockerRepositoryImage"
    post:
      tags: [docker]
      summary: Reserve a container image before push
      description: |
        Creates an empty public or private image and assigns the caller L4. Docker pushes cannot create images
        implicitly. Names must be unique within the repository and cannot match an image exposed by an enabled mirror.
      operationId: createDockerImage
      security:
        - sessionCookie: []
        - sessionHeader: []
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  maxLength: 255
                  example: team/service
                private:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Image reserved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DockerRepositoryImage"
        "400":
          description: Invalid lowercase Docker image name.
        "409":
          description: Image name is already occupied locally or by an enabled upstream mirror.
        "503":
          description: An enabled upstream mirror could not provide an authoritative image-name result.

  # ========== Docker / OCI Registry ==========
  /v2/:
    get:
      tags: [docker]
      summary: OCI API version check
      description: |
        Returns `200` when authenticated, or `401` with a `WWW-Authenticate: Bearer` challenge.
        Implements the OCI Distribution Specification API version check.
      operationId: getDockerBase
      security:
        - {}
        - basicAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Registry API v2 is available and the client is authenticated.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Authentication required. Includes a `WWW-Authenticate` Bearer challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OciErrorList"

  /v2/token:
    get:
      tags: [docker]
      summary: Docker token authentication
      description: |
        Issues a Bearer token per the Docker token authentication specification.
        Credentials provided via Basic auth or omitted for anonymous access to public content.
      operationId: getDockerToken
      security:
        - {}
        - basicAuth: []
      parameters:
        - name: service
          in: query
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
          description: Requested scope (e.g. `repository:name:pull,push`).
        - name: account
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Bearer token issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_in:
                    type: integer
                  issued_at:
                    type: string
                    format: date-time
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OciErrorList"

  /v2/_catalog:
    get:
      tags: [docker]
      summary: List image repositories
      operationId: getDockerCatalog
      security:
        - {}
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: n
          in: query
          schema:
            type: integer
          description: Maximum number of repositories per page.
        - name: last
          in: query
          schema:
            type: string
          description: Last repository name from the previous page (for pagination).
      responses:
        "200":
          description: Repository catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  repositories:
                    type: array
                    items:
                      type: string

  /v2/{name}/tags/list:
    get:
      tags: [docker]
      summary: List tags for an image
      operationId: getDockerTagsList
      security:
        - {}
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Image repository name (may contain slashes, e.g. `namespace/image`).
        - name: n
          in: query
          schema:
            type: integer
        - name: last
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tag list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  tags:
                    type: array
                    items:
                      type: string
        "404":
          description: Repository not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OciErrorList"

  /v2/{name}/manifests/{reference}:
    get:
      tags: [docker]
      summary: Pull image manifest
      description: Returns the manifest for the given tag or digest. Supports all standard OCI and Docker manifest media types.
      operationId: getDockerManifest
      security:
        - {}
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: reference
          in: path
          required: true
          schema:
            type: string
          description: Tag name or digest (e.g. `latest` or `sha256:abc123...`).
      responses:
        "200":
          description: Manifest content.
          content:
            application/vnd.oci.image.manifest.v1+json:
              schema:
                type: object
            application/vnd.docker.distribution.manifest.v2+json:
              schema:
                type: object
        "404":
          description: Manifest not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OciErrorList"
    head:
      tags: [docker]
      summary: Check manifest existence
      operationId: headDockerManifest
      security:
        - {}
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Manifest exists.
        "404":
          description: Manifest not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OciErrorList"
    put:
      tags: [docker]
      summary: Push image manifest
      description: Stores or updates the manifest for the given reference. The target image must already exist and the caller requires L1 or higher.
      operationId: putDockerManifest
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: reference
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.oci.image.manifest.v1+json:
            schema:
              type: object
          application/vnd.docker.distribution.manifest.v2+json:
            schema:
              type: object
      responses:
        "201":
          description: Manifest stored.
          headers:
            Location:
              schema:
                type: string
            Docker-Content-Digest:
              schema:
                type: string
        "400":
          description: Invalid manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OciErrorList"
    delete:
      tags: [docker]
      summary: Delete image manifest
      description: Requires write permission.
      operationId: deleteDockerManifest
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Manifest deleted.
        "404":
          description: Manifest not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OciErrorList"

  /v2/{name}/blobs/{digest}:
    get:
      tags: [docker]
      summary: Pull blob
      operationId: getDockerBlob
      security:
        - {}
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: digest
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blob content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Blob not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OciErrorList"
    head:
      tags: [docker]
      summary: Check blob existence
      operationId: headDockerBlob
      security:
        - {}
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: digest
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blob exists.
        "404":
          description: Blob not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OciErrorList"
    delete:
      tags: [docker]
      summary: Delete blob
      description: Requires write permission.
      operationId: deleteDockerBlob
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: digest
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Blob deleted.
        "404":
          description: Blob not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OciErrorList"

  /v2/{name}/blobs/uploads/:
    post:
      tags: [docker]
      summary: Initiate blob upload
      description: |
        Starts a blob upload session. Supports cross-repository mounting via
        `?mount=<digest>&from=<name>`. Returns a `Location` for subsequent PATCH/PUT.
      operationId: postDockerBlobUpload
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: mount
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
      responses:
        "202":
          description: Upload session created.
          headers:
            Location:
              schema:
                type: string
            Docker-Upload-UUID:
              schema:
                type: string
        "201":
          description: Blob mounted from another repository.

  /v2/{name}/blobs/uploads/{uuid}:
    patch:
      tags: [docker]
      summary: Append chunk to blob upload
      operationId: patchDockerBlobUpload
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Chunk accepted.
          headers:
            Range:
              schema:
                type: string
    put:
      tags: [docker]
      summary: Complete blob upload
      description: Finalizes the upload by providing the expected digest. Server verifies before committing.
      operationId: putDockerBlobUpload
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: digest
          in: query
          required: true
          schema:
            type: string
          description: Expected digest (e.g. `sha256:abc123...`).
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Blob committed.
          headers:
            Docker-Content-Digest:
              schema:
                type: string
        "400":
          description: Digest mismatch or invalid upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OciErrorList"
    get:
      tags: [docker]
      summary: Get blob upload status
      operationId: getDockerBlobUploadStatus
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Upload status.
          headers:
            Range:
              schema:
                type: string
              description: Byte range received (e.g. `0-1048576`).
        "404":
          description: Upload session not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OciErrorList"
    delete:
      tags: [docker]
      summary: Cancel blob upload
      operationId: deleteDockerBlobUpload
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Upload session cancelled.
        "404":
          description: Upload session not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OciErrorList"
