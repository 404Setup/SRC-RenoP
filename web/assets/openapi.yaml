  # ========== Storage (Maven layout) ==========
  /{repo_name}/{path}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/MavenPath"
    get:
      tags: [storage]
      summary: Download artifact or browse path
      description: |
        Serves a Maven artifact or directory listing. Supports conditional requests (`If-None-Match`,
        `If-Modified-Since`). Anonymous GET is permitted on PUBLIC and HIDDEN repositories.
        Server route: `/:repo_name/*`.
      operationId: getStoragePath
      security:
        - {}
        - basicAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Artifact body.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
                description: Management SPA fallback for browser requests.
        "304":
          description: Not modified.
        "401":
          $ref: "#/components/responses/PlainUnauthorized"
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "404":
          $ref: "#/components/responses/PlainNotFound"
    head:
      tags: [storage]
      summary: Artifact metadata
      description: Returns headers only (Content-Length, Content-Type, Last-Modified, ETag) without a body.
      operationId: headStoragePath
      security:
        - {}
        - basicAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Headers only.
        "404":
          $ref: "#/components/responses/PlainNotFound"
    put:
      tags: [storage]
      summary: Upload or overwrite artifact
      description: Requires write (`canupdate`) permission. Returns `507` when disk space is insufficient.
      operationId: putStoragePath
      security:
        - basicAuth: []
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Artifact stored.
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "507":
          description: Insufficient disk space.
    post:
      tags: [storage]
      summary: Upload or overwrite artifact (POST)
      description: Identical to the PUT variant. Provided for compatibility with tools that prefer POST.
      operationId: postStoragePath
      security:
        - basicAuth: []
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Artifact stored.
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "403":
          $ref: "#/components/responses/PlainForbidden"
    delete:
      tags: [storage]
      summary: Delete artifact or path
      description: Requires write (`canupdate`) permission.
      operationId: deleteStoragePath
      security:
        - basicAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/PlainForbidden"
        "404":
          $ref: "#/components/responses/PlainNotFound"

  # ========== Javadoc ==========
  /javadoc/{repo_name}/{path}:
    get:
      tags: [javadoc]
      summary: Javadoc jar preview
      description: |
        Serves files extracted from a Javadoc jar. Append `/raw/...` to retrieve jar-internal resources.
        Requires read permission. Extraction is size-limited by `storage.max_javadoc_size_mb`.
        Server route: `/javadoc/:repo_name/*`.
      operationId: getJavadoc
      security:
        - {}
        - basicAuth: []
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RepoName"
