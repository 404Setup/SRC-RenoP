<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="renop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="1" />
      <stop offset="35%" stop-color="#00F2FE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="160" fill="url(#core-glow)" opacity="0.3" filter="url(#neon-glow)" />

  <circle cx="256" cy="256" r="32" fill="url(#core-glow)" />
  <circle cx="256" cy="256" r="8" fill="#FFFFFF" opacity="0.9" />

  <path d="M 156 356 L 256 406 L 356 356 M 256 206 L 256 406 M 256 106 L 256 206"
        stroke="#3B82F6"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        opacity="0.35" />

  <path d="M 156 356 L 156 156 L 256 106 L 356 156 L 356 256 L 256 206 L 156 256 M 256 206 L 356 356"
        stroke="url(#renop-grad)"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        filter="url(#neon-glow)" />
</svg>
