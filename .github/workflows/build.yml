name: Build RenoP

on:
  push:
  workflow_dispatch:

concurrency:
  group: renop-actions
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  metadata:
    name: Read commit build metadata
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.metadata.outputs.skip }}
      release: ${{ steps.metadata.outputs.release }}
      version: ${{ steps.metadata.outputs.version }}
      development: ${{ steps.metadata.outputs.development }}
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
      previous_commit: ${{ steps.metadata.outputs.previous_commit }}
      targets: ${{ steps.metadata.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Inspect commit message
        id: metadata
        shell: pwsh
        run: |
          $message = (git log -1 --format=%s).Trim()
          $commit = (git rev-parse HEAD).Trim()
          $skip = $message.StartsWith('[skip ci]', [StringComparison]::OrdinalIgnoreCase) -or
              $message.StartsWith('[ci skip]', [StringComparison]::OrdinalIgnoreCase) -or
              $message.StartsWith('[web]', [StringComparison]::OrdinalIgnoreCase)
          $release = $false
          $version = ''
          $previousCommit = ''
          if (-not $skip -and $message.StartsWith('[release]', [StringComparison]::OrdinalIgnoreCase)) {
              $version = $message.Substring('[release]'.Length).Trim()
              if ([string]::IsNullOrWhiteSpace($version)) {
                  throw 'A [release] commit must include a version, for example: [release] v1.2.3'
              }
              $release = $true
              $previousCommit = [string](git log -1 --format='%H' -i --grep='^\[release\]' HEAD^ 2>$null)
              $previousCommit = $previousCommit.Trim()
              if ([string]::IsNullOrWhiteSpace($previousCommit)) {
                  $previousTag = [string](git describe --tags --abbrev=0 HEAD^ 2>$null)
                  $previousTag = $previousTag.Trim()
                  if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
                      $previousCommit = (git rev-parse "$previousTag^{commit}").Trim()
                  }
              }
          } elseif (-not $skip) {
              $version = (git rev-parse --short HEAD).Trim()
          }
          $development = if ($release) { 'false' } else { 'true' }
          $tag = if ($release) { $version } else { '' }
          $targets = (Import-PowerShellDataFile ./scripts/build-targets.psd1).Targets
          "targets=$($targets | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT
          "skip=$($skip.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "development=$development" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "previous_commit=$previousCommit" >> $env:GITHUB_OUTPUT
          Write-Host "Commit: $message"
          Write-Host "Version: $version sha=$commit (development=$development, skip=$skip)"

  prepare:
    name: Prepare shared build inputs
    needs: metadata
    if: needs.metadata.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      go-version: ${{ steps.go.outputs.go-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install custom Go runtime
        id: go
        uses: ./.github/actions/setup-go-runtime
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: "36.0"
      - name: Generate shared sources and frontend
        shell: pwsh
        run: |
          ./build.ps1 -PrepareOnly
          if ($LASTEXITCODE -ne 0) { throw 'Shared build preparation failed.' }
          go mod download
          if ($LASTEXITCODE -ne 0) { throw 'Module download failed.' }
          go build -o "$env:RUNNER_TEMP/renop-brotli" ./cmd/renop-brotli
          if ($LASTEXITCODE -ne 0) { throw 'Brotli tool build failed.' }
          tar -cf "$env:RUNNER_TEMP/prepared-inputs.tar" pkg/pb/api.pb.go pkg/pb/session.pb.go internal/mail/data internal/service/frontend/renop-html/dist
          if ($LASTEXITCODE -ne 0) { throw 'Shared input archive failed.' }
      - name: Upload prepared sources
        uses: actions/upload-artifact@v7
        with:
          name: prepared-inputs
          path: ${{ runner.temp }}/prepared-inputs.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Upload native packaging tool
        uses: actions/upload-artifact@v7
        with:
          name: packaging-tool
          path: ${{ runner.temp }}/renop-brotli
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  build:
    name: Compile ${{ matrix.GOOS }}/${{ matrix.GOARCH }}
    needs: [metadata, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install the prepared Go runtime version
        uses: ./.github/actions/setup-go-runtime
        with:
          go-version: ${{ needs.prepare.outputs.go-version }}
          clean-cache: false
          cache-suffix: ${{ matrix.GOOS }}-${{ matrix.GOARCH }}
      - name: Download shared sources
        uses: actions/download-artifact@v8
        with:
          name: prepared-inputs
          path: ${{ runner.temp }}/prepared
      - name: Compile one target
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.GOOS }}/${{ matrix.GOARCH }}
          RENOP_VERSION: ${{ needs.metadata.outputs.version }}
          RENOP_DEVELOPMENT: ${{ needs.metadata.outputs.development }}
          RENOP_COMMIT: ${{ needs.metadata.outputs.commit }}
          RENOP_PREVIOUS_COMMIT: ${{ needs.metadata.outputs.previous_commit }}
        run: |
          tar -xf "$env:RUNNER_TEMP/prepared/prepared-inputs.tar"
          if ($LASTEXITCODE -ne 0) { throw 'Shared input extraction failed.' }
          New-Item -ItemType Directory -Path ./dist -Force | Out-Null
          Set-Location ./dist
          ../build.ps1 -Target $env:BUILD_TARGET -SkipPreparation -nb -Version $env:RENOP_VERSION -Development $env:RENOP_DEVELOPMENT -Commit $env:RENOP_COMMIT -PreviousCommit $env:RENOP_PREVIOUS_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed for $env:BUILD_TARGET" }
      - name: Upload compiled executable
        uses: actions/upload-artifact@v7
        with:
          name: executable-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          path: dist/renop*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package ${{ matrix.GOOS }}/${{ matrix.GOARCH }}
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download compiled executable
        uses: actions/download-artifact@v8
        with:
          name: executable-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          path: executable
      - name: Download packaging tool
        uses: actions/download-artifact@v8
        with:
          name: packaging-tool
          path: tools
      - name: Restore packaging tool permissions
        run: chmod +x tools/renop-brotli
      - name: Compress the target
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.GOOS }}/${{ matrix.GOARCH }}
          RENOP_VERSION: ${{ needs.metadata.outputs.version }}
        run: ./.github/scripts/package-matrix-target.ps1 -Target $env:BUILD_TARGET -Version $env:RENOP_VERSION -BinaryDir ./executable -DistDir ./release-packages -BrotliTool ./tools/renop-brotli
      - name: Upload target package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          path: release-packages/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble and validate all targets
    needs: [metadata, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download target packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: release-packages
          merge-multiple: true
      - name: Assemble the release manifest
        shell: pwsh
        env:
          RENOP_VERSION: ${{ needs.metadata.outputs.version }}
          RENOP_DEVELOPMENT: ${{ needs.metadata.outputs.development }}
          RENOP_COMMIT: ${{ needs.metadata.outputs.commit }}
          RENOP_PREVIOUS_COMMIT: ${{ needs.metadata.outputs.previous_commit }}
        run: |
          ./.github/scripts/assemble-matrix.ps1 -PackageDir ./release-packages -DistDir ./dist -Version $env:RENOP_VERSION -Development $env:RENOP_DEVELOPMENT -Commit $env:RENOP_COMMIT -PreviousCommit $env:RENOP_PREVIOUS_COMMIT
          ./.github/scripts/test-release-payload.ps1 -DistDir ./dist
      - name: Upload complete release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-artifacts
          path: |
            dist/*.br
            dist/manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to official update host
    needs: [metadata, assemble]
    if: needs.metadata.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist
      - name: Validate update payload boundary
        shell: pwsh
        run: pwsh -NoProfile -File ./.github/scripts/test-release-payload.ps1 -DistDir ./dist
      - name: Generate changelog
        id: changelog
        shell: pwsh
        env:
          COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'changelog.md'
          pwsh -NoProfile -File ./.github/scripts/generate-changelog.ps1 `
              -Commit $env:COMMIT `
              -OutFile $out
          "path=$out" >> $env:GITHUB_OUTPUT
      - name: Publish packages
        shell: pwsh
        env:
          RENOP_PUBLISH_TOKEN: ${{ secrets.RENOP_PUBLISH_TOKEN }}
          IS_RELEASE: ${{ needs.metadata.outputs.release }}
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          PREVIOUS_COMMIT: ${{ needs.metadata.outputs.previous_commit }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RENOP_PUBLISH_TOKEN)) {
              throw 'Repository secret RENOP_PUBLISH_TOKEN is not set'
          }
          $channel = if ($env:IS_RELEASE -eq 'true') { 'stable' } else { 'nightly' }
          pwsh -NoProfile -File ./.github/scripts/publish-update.ps1 `
              -Channel $channel `
              -DistDir ./dist `
              -Version $env:VERSION `
              -Commit $env:COMMIT `
              -PreviousCommit $env:PREVIOUS_COMMIT `
              -ChangelogFile "${{ steps.changelog.outputs.path }}"

  release:
    name: Publish GitHub release notes and assets
    needs: [metadata, assemble, publish]
    if: needs.metadata.outputs.release == 'true' && needs.metadata.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist
      - name: Build changelog from commits
        id: changelog
        shell: pwsh
        env:
          COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $footer = 'Downloads: https://mvnc.pkg.one/update/renop/stable'
          pwsh -NoProfile -File ./.github/scripts/generate-changelog.ps1 `
              -Commit $env:COMMIT `
              -OutFile $out `
              -Footer $footer
          "path=$out" >> $env:GITHUB_OUTPUT
          Write-Host "----- release notes -----"
          Get-Content -LiteralPath $out -Raw
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ needs.metadata.outputs.commit }}
          generate_release_notes: false
          body_path: ${{ steps.changelog.outputs.path }}
          files: |
            dist/*.br
            LICENSE
            README.md
            THIRD_PARTY_NOTICES.md
