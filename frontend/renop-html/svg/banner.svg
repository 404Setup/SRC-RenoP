<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#080B11"/>
            <stop offset="100%" stop-color="#121824"/>
        </linearGradient>

        <linearGradient id="renop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366F1"/>
            <stop offset="40%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#06B6D4"/>
        </linearGradient>

        <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00F2FE" stop-opacity="1"/>
            <stop offset="35%" stop-color="#00F2FE" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
        </radialGradient>

        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="bg-blur" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="80"/>
        </filter>
    </defs>

    <style>
        .banner-title {
        font-family: 'Open Sans', system-ui, -apple-system, sans-serif;
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -2px;
        fill: #FFFFFF;
        }
    </style>

    <rect width="1200" height="400" fill="url(#bg-grad)"/>

    <g opacity="0.05">
        <path d="M 0 0 L 1200 0 M 0 40 L 1200 40 M 0 80 L 1200 80 M 0 120 L 1200 120 M 0 160 L 1200 160 M 0 200 L 1200 200 M 0 240 L 1200 240 M 0 280 L 1200 280 M 0 320 L 1200 320 M 0 360 L 1200 360"
              stroke="#3B82F6" stroke-width="1"/>
        <path d="M 0 0 L 0 400 M 40 0 L 40 400 M 80 0 L 80 400 M 120 0 L 120 400 M 160 0 L 160 400 M 200 0 L 200 400 M 240 0 L 240 400 M 280 0 L 280 400 M 320 0 L 320 400 M 360 0 L 360 400 M 400 0 L 400 400 M 440 0 L 440 400 M 480 0 L 480 400 M 520 0 L 520 400 M 560 0 L 560 400 M 600 0 L 600 400 M 640 0 L 640 400 M 680 0 L 680 400 M 720 0 L 720 400 M 760 0 L 760 400 M 800 0 L 800 400 M 840 0 L 840 400 M 880 0 L 880 400 M 920 0 L 920 400 M 960 0 L 960 400 M 1000 0 L 1000 400 M 1040 0 L 1040 400 M 1080 0 L 1080 400 M 1120 0 L 1120 400 M 1160 0 L 1160 400"
              stroke="#3B82F6" stroke-width="1"/>
    </g>

    <circle cx="1000" cy="80" r="280" fill="#6366F1" opacity="0.18" filter="url(#bg-blur)"/>
    <circle cx="220" cy="200" r="220" fill="#06B6D4" opacity="0.12" filter="url(#bg-blur)"/>

    <g transform="translate(100, 80) scale(0.46875)">
        <circle cx="256" cy="256" r="160" fill="url(#core-glow)" opacity="0.3" filter="url(#neon-glow)"/>

        <circle cx="256" cy="256" r="32" fill="url(#core-glow)"/>
        <circle cx="256" cy="256" r="8" fill="#FFFFFF" opacity="0.9"/>

        <path d="M 156 356 L 256 406 L 356 356 M 256 206 L 256 406 M 256 106 L 256 206"
              stroke="#3B82F6"
              stroke-width="8"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
              opacity="0.35"/>

        <path d="M 156 356 L 156 156 L 256 106 L 356 156 L 356 256 L 256 206 L 156 256 M 256 206 L 356 356"
              stroke="url(#renop-grad)"
              stroke-width="24"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
              filter="url(#neon-glow)"/>
    </g>

    <g transform="translate(400, 0)">
        <text x="0" y="228" class="banner-title">RenoP</text>
    </g>
</svg>
